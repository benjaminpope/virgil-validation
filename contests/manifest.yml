# The optical/IR interferometric imaging contests ("Imaging Beauty Contest",
# later "Optical Interferometry Imaging Contest" / I2C), held at SPIE
# Astronomical Telescopes + Instrumentation every two years since 2004.
#
# Data files are not committed: scripts/fetch_contests.py downloads them into
# a data directory (default ~/data/imaging_contests) and checks each sha256.
# Papers were found on ADS (queried 2026-10-04); data locations, organisers
# and winners were read from the papers, the archived contest pages and the
# OiDB collections. See docs/plan_imaging_contests.md.
#
# Per contest:
#   bibcode, doi, arxiv  the contest paper
#   organisers           who made the data (and their institutes then)
#   instrument           the real or simulated instrument(s)
#   targets              what the data are of
#   winner               winner and code; runners-up in `notes`
#   truth                where the truth image is, if anywhere
#   files                name, url, sha256, role (contest | test | doc)
#
# Roles: `contest` files are the blind data; `test` files are the binaries
# the organisers handed out to check conventions before the contest; `doc`
# files are readmes and rules.

jmmc: &jmmc https://apps.jmmc.fr/oidata/BeautyContest
oidb: &oidb https://oidb.jmmc.fr/exist/apps/oidb-data/oifits/staging

contests:
  "2004":
    bibcode: 2004SPIE.5491..886L
    doi: 10.1117/12.550710
    organisers: ["Peter Lawson (JPL, chair)", "Bill Cotton (NRAO, test data)", "Christian Hummel (ESO, simulated the data with OYSTER)"]
    instrument: NPOI, 6 stations, simulated; one channel at 550 nm
    presubmission: "data released blind (no target description); possible morphologies listed on the page; OI_TARGET names are decoys; test binary BSC1948 21.2 mas PA 341.6 ratio 5.75"
