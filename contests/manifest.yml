      data1: model of LkHa 101 (star in an asymmetric shell), image by Peter Tuthill; 242x242 pixels of 0.05 mas
      data2: binary, A a limb-darkened elliptical disk 5.5 mas across with a bright spot, B a 0.5 mas disk, 10 mas at PA 90 deg
    winner: BSMEM (Thorsteinsson & Young, Cambridge)
    notes: "Scores (sum of sigma/peak, lower better): BSMEM 0.50, WISARD 1.68, VLBMEM 1.87, MiRA 5.98."
    truth: not posted; data2 is analytic and can be rebuilt from the paper
