# Figures in the contest papers: truth panels and entries' reconstructions,
# for the gallery (docs/contest_gallery.md). scripts/contest_figures.py makes
# crops from this manifest and each paper's PDF, keyed by the PDF's sha256,
# into ~/data/imaging_contests/figures/ (outside the repository).
#
# PDFs live in ~/data/imaging_contests/papers/<year>.pdf (arXiv versions
# fetched directly; the others supplied by Ben) and are never committed; nor are crops, unless `licence.reusable` is true.
#
# papers.<year>:
#   ads        ADS abstract page (the public page links here)
#   arxiv      arXiv id, where the paper has one (the PDF is fetched from there)
#   sha256     of the PDF the bboxes were measured on (filled by `inventory`)
#   licence    per copy: where it was read, what it says, the date checked;
#              reusable: true only for an explicit licence that permits
#              republication (CC BY or CC BY-SA). Never guessed.
#   panels     one entry per wanted panel:
#       figure, panel   as the paper labels them ("Fig. 3", "b")
#       page            1-based
#       role            truth | winner | entry
#       method          the entry's code and authors (for winner and entry)
#       bbox            [x0, y0, x1, y1] in PDF points, origin top left;
#                       written by `inventory`/`split`, overridden by hand
#       extent_mas      [east, west, south, north] edges in mas, from the axes,
#                       when the figure has them; else null
#       scale, orientation  as stated in the caption or on the axes
#
# Licences checked 2026-10-12 from landing pages and from the text of each
# PDF (the Creative Commons text in 2018 and 2022 is BSMEM's software licence,
# not the paper's; 2014 and 2016 print © SPIE). No copy carries
# a Creative Commons licence, so every paper is `reusable: false` and the
# public page links to the figures instead of showing them.

