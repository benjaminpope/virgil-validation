    ads: https://ui.adsabs.harvard.edu/abs/2004SPIE.5491..886L/abstract
    licence:
      reusable: false
      copies:
        - {where: SPIE, says: "© SPIE (closed access); landing page not readable", checked: 2026-10-12}
