    source: [src/virgil/models.py, src/virgil/_elr.py]
    depends: [virgil._elr]
    convention: [pole_pa]  # the pole's position angle on the sky
  virgil.models.cvis_limb_darkened_disk: {layer: models, source: [src/virgil/models.py]}
  virgil.models.LimbDarkenedDisk:
    layer: models
    source: [src/virgil/models.py]
    depends: [virgil.models.cvis_limb_darkened_disk]
  virgil.models.QuadraticLimbDarkenedDisk:
    layer: models
    source: [src/virgil/models.py]
    depends: [virgil.models.cvis_limb_darkened_disk]
  virgil.models.SquareRootLimbDarkenedDisk:
    layer: models
    source: [src/virgil/models.py]
    depends: [virgil.models.cvis_limb_darkened_disk]
  virgil.models.FlaredDiskGaussian: {layer: models, source: [src/virgil/models.py], properties: {near_side: 1}}
  virgil.models.FlaredDiskHG: {layer: models, source: [src/virgil/models.py], properties: {near_side: 1}}
  virgil.models.FlaredDiskPowerLaw: {layer: models, source: [src/virgil/models.py], properties: {near_side: 1}}
  virgil.models.HarmonixModel: {layer: models, source: [src/virgil/models.py], doc: models/flared_disks.md#the-harmonix-wrapper}
  virgil.models.FlaredDisk: {layer: models, source: [src/virgil/models.py], doc: models/flared_disks.md}
  virgil.models.cvis_uniform_disk: {layer: models, source: [src/virgil/models.py], doc: models/visibilities.md#closed-form-helpers}
  virgil.models.cvis_binary: {layer: models, source: [src/virgil/models.py], doc: models/visibilities.md#closed-form-helpers}
