  virgil.spectra.flux_at: {layer: models, source: [src/virgil/spectra.py], doc: models/spectra.md#the-spectrum-interface}
  virgil.spectra.Scaled: {layer: models, source: [src/virgil/spectra.py], doc: models/spectra.md#the-spectrum-interface}
  virgil.spectra.reference_flux: {layer: models, source: [src/virgil/spectra.py], doc: models/spectra.md#the-spectrum-interface}
  virgil.spectra.PowerLaw: {layer: models, source: [src/virgil/spectra.py]}
  virgil.spectra.BlackBody: {layer: models, source: [src/virgil/spectra.py]}

  # ------------------------------------------------------------- radio
  # virgil.radio (instrument-neutral): tests/test_alma_radio.py against crosscheck.sky,
  # crosscheck.alma and the CASA worker (docs/alma_conventions.md)
  virgil.radio.ComplexVisData: {layer: data, source: [src/virgil/radio.py], doc: alma_conventions.md}
  virgil.radio.ComplexVisData.read_ms:
    layer: data
    source: [src/virgil/radio.py]
    depends: [virgil.radio.ComplexVisData]
    properties: {conjugation: 1}  # DATA is conj(V) at u = +UVW[0] nu / c: CASA's own prediction
    doc: alma_conventions.md
  virgil.radio.ComplexVisData.dirty_image: {layer: imaging, source: [src/virgil/radio.py], depends: [virgil.radio.ComplexVisData], doc: alma_conventions.md}
  virgil.radio.ComplexVisData.dirty_beam: {layer: imaging, source: [src/virgil/radio.py], depends: [virgil.radio.ComplexVisData], doc: alma_conventions.md}
  virgil.radio_clean.fit_beam: {layer: imaging, source: [src/virgil/radio_clean.py], doc: alma_conventions.md}
  virgil.radio_clean.restore: {layer: imaging, source: [src/virgil/radio_clean.py], doc: alma_conventions.md}
  virgil.radio_clean.clean: {layer: imaging, source: [src/virgil/radio_clean.py], depends: [virgil.radio.ComplexVisData, virgil.radio.ComplexVisData.dirty_image, virgil.radio.ComplexVisData.model, virgil.radio_clean.fit_beam, virgil.radio_clean.restore], doc: alma_conventions.md}
  virgil.radio_clean.RadioCleanResult: {layer: imaging, source: [src/virgil/radio_clean.py], depends: [virgil.radio_clean.clean], doc: alma_conventions.md}
  virgil.radio.CalibrationNuisance: {layer: likelihood, source: [src/virgil/radio.py], depends: [virgil.radio.ComplexVisData], doc: alma_conventions.md}
  virgil._antenna_gains.marginal: {layer: likelihood, source: [src/virgil/_antenna_gains.py], depends: [virgil.radio.CalibrationNuisance], doc: alma_conventions.md}  # B7 Stage 1 (Laplace): tests/test_radio_trust_numpy.py against Gauss-Hermite quadrature
  virgil.radio.ComplexVisData.model:
    layer: likelihood
    source: [src/virgil/radio.py]
    depends: [virgil.radio.ComplexVisData, virgil.radio.CalibrationNuisance, virgil.models.Image]
  virgil.radio.ComplexVisData.term:
    layer: likelihood
    source: [src/virgil/radio.py]
    depends: [virgil.radio.ComplexVisData.model]
    doc: alma_conventions.md
  virgil.radio.ComplexVisData.chi2_by_ddid: {layer: likelihood, source: [src/virgil/radio.py], depends: [virgil.radio.ComplexVisData.model], doc: alma_conventions.md}
  virgil.radio.primary_beam: {layer: imaging, source: [src/virgil/radio.py], depends: [virgil.models.Image], doc: alma_conventions.md}
  virgil.radio.dartboard_folds: {layer: likelihood, source: [src/virgil/radio.py], depends: [virgil.radio.ComplexVisData], doc: alma_conventions.md}
  virgil.radio.SigmaScale: {layer: likelihood, source: [src/virgil/radio.py], depends: [virgil.radio.ComplexVisData], doc: alma_conventions.md}
  virgil.radio.ComplexVisData.sigma_scale:
    layer: likelihood
    source: [src/virgil/radio.py]
    depends: [virgil.radio.ComplexVisData, virgil.radio.SigmaScale]
    doc: alma_conventions.md
  virgil.radio.fit_staged_nuisances:
    layer: inference
    source: [src/virgil/radio.py]
    depends: [virgil.fitting.fit, virgil.fitting.kkt_report, virgil.radio.CalibrationNuisance, virgil.radio.ComplexVisData.term]
    doc: alma_conventions.md
  virgil.radio.StagedFit:
    layer: inference
    source: [src/virgil/radio.py]
    depends: [virgil.radio.fit_staged_nuisances]
    doc: alma_conventions.md
  # Register items B2, B5, B6 (virgil design/radio_imaging_innovations.md): tests/test_radio_innovations.py; B5's spread offsets (chi2, gradient, fit, bound) also tests/test_radio_spread_offsets.py. These need
  # virgil after 0.4.0 (gauss_newton_diag, radio_toeplitz); CI's pin has both since the F6 bump (virgil#533).
  # tests/test_radio_trust_numpy.py (tier A, numpy references) and tests/test_radio_trust_casa.py (tier B, real casatools and
  # casatasks in .venv-alma) add: from_arrays, dirty_image/dirty_beam, the joint default nuisance fit (F2), gauss_newton_diag
  # against finite differences, the antenna-gain Laplace marginal, read_ms against raw columns, fit_beam and clean against tclean.
  virgil.fitting.gauss_newton_diag: {layer: imaging, source: [src/virgil/fitting.py], depends: [virgil.fitting.fit, virgil.imaging.MaxEntropy, virgil.radio.ComplexVisData.term], doc: alma_conventions.md}
  virgil.radio_toeplitz.ToeplitzVisData: {layer: likelihood, source: [src/virgil/radio_toeplitz.py, src/virgil/_nufft_spread.py], depends: [virgil.radio.ComplexVisData.term], doc: alma_conventions.md}
  crosscheck.radio_trust: {layer: references, doc: alma_conventions.md}  # numpy dirty image/beam sums, Briggs weights, gain-marginal quadrature (virgil#533)
  crosscheck.starlet_kkt_ref: {layer: references, doc: imaging/machinery.md#kkt-optimality-certificates}  # numpy/scipy scenes, B3 starlet, KKT, DoF discrepancy, L-curve corner, Laplace GP, MYTHRA & radio differencing (every helper self-checked in test_042_scenes_starlet_kkt.py)
  crosscheck.radio_offsets: {layer: references, depends: [crosscheck.radio_innovations], doc: alma_conventions.md}  # B5 free offsets: exact phase-ramp chi2, analytic gradient, Fisher information (numpy only); tests/test_radio_spread_offsets.py
  crosscheck.radio_exact: {layer: references, depends: [crosscheck.radio_innovations], doc: alma_conventions.md}  # G2: numpy-only direct-sum chi2, loss, gradients and the derived round-off budget (design/toeplitz_reexam_042.md)
  crosscheck.toeplitz_scenes: {layer: references, depends: [crosscheck.radio_exact, crosscheck.radio_innovations], doc: alma_conventions.md}  # G2: held-out synthetic scenes and coverages, seeds from hashed names
  crosscheck.radio_innovations: {layer: references, doc: alma_conventions.md}  # B2, B5: numpy softmax image, Gauss-Newton diagonal, entropy metric, direct DDID chi2
  crosscheck.radio_innovations.DeltaProblem: {layer: references, doc: alma_conventions.md}  # B6, float32 linear-delta-V loss: the method alone, virgil has no code for it yet
  crosscheck.preregistration: {layer: references, doc: alma_conventions.md}  # pre-registered gate criteria commit pinning and dirty/untracked refusal

