    source: [src/virgil/coverage.py]
  virgil.amigo.load_oi_data:
    layer: data
    source: [src/virgil/amigo.py]
    depends: [virgil.oidata.OIData]
    doc: data/amigo.md
  virgil.coverage.mask_transfer: {layer: data, source: [src/virgil/coverage.py], doc: data/masking.md#mask-geometry}
  virgil.coverage.nrm_oidata: {layer: data, source: [src/virgil/coverage.py], doc: data/masking.md#mask-geometry}

