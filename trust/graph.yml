  crosscheck.skyplane: {layer: references, depends: [crosscheck.orbits], doc: orbits/epochs.md}
  crosscheck.disks: {layer: references}
  crosscheck.elr: {layer: references, depends: [crosscheck.sky]}
  crosscheck.nrm: {layer: references, depends: [crosscheck.sky]}
  crosscheck.image_metrics: {layer: references}
  crosscheck.informed_starts: {layer: references, doc: imaging/metrics_ensembles.md}
  crosscheck.alma: {layer: references, doc: alma_conventions.md}  # incl. the exact DFT image_visibilities and its adjoint
  external_bridge.alma_worker: {layer: references, doc: alma_conventions.md}
  external_bridge.casa_clean_worker: {layer: references, doc: alma_conventions.md}
  external_bridge.mpol_worker: {layer: references, depends: [external_bridge.cv_folds, external_bridge.npz_compare], doc: alma_conventions.md}  # MPoL's own Net, loss and autograd, in .venv-mpol; also the reference-run tasks export_checkpoint, objective_full, asdf_vs_npz (tests/test_alma_mpol_ref.py, conventions Part 4) and the cross-validation tasks export_fold_asdf, score_fold (tests/test_alma_mpol_cv.py, conventions Part 6)
  external_bridge.npz_compare: {layer: references, doc: alma_conventions.md}  # channel-rank matched visibility comparison between visread NPZ and virgil read_ms
  external_bridge.cv_folds: {layer: references, depends: [external_bridge.npz_compare], doc: alma_conventions.md}  # asdf points matched to virgil's dartboard fold file (numpy only); tallies and the profiled score of both codes (tests/test_alma_mpol_cv.py, conventions Part 6)
  external_bridge.cv_compare: {layer: references, depends: [external_bridge.cv_folds], doc: alma_conventions.md}  # MPoL's held-out scores beside virgil's, per fold and annulus (numpy only; `alma_imlup_maxent.py cv-compare`)
  virgil_bridge.mpol: {layer: references, doc: alma_conventions.md}  # virgil.radio in MPoL's parametrisation (the map)
  virgil_bridge.alma: {layer: references, depends: [crosscheck.alma, crosscheck.alma_maxent], doc: alma_conventions.md}  # IM Lup P3: R objective (MPoL's entropy term), folds, scoring
  virgil_bridge.alma_start: {layer: references, depends: [crosscheck.alma_maxent, crosscheck.preregistration, virgil_bridge.alma], doc: alma_conventions.md}  # IM Lup MaxEnt cold starts: our CLEAN model regridded to the fit grid, the image-fixed stage's gain check
  virgil_bridge.alma_gp: {layer: references, depends: [crosscheck.alma_maxent, virgil_bridge.alma, virgil_bridge.alma_start], doc: alma_conventions.md}  # IM Lup GP image: Image(MultipoleField) with config R's nuisances through the Toeplitz chi^2; stage 1 holds the nuisances (`alma_imlup_gp.py`)
  virgil_bridge.alma_synth: {layer: references, depends: [crosscheck.alma_maxent, virgil_bridge.alma, virgil_bridge.alma_start], doc: alma_conventions.md}  # IM Lup synthetic truth: smooth disk, real uv and weights, dots/NRMSE scoring (`alma_imlup_synth.py`)
  virgil_bridge.alma_replica: {layer: references, depends: [virgil_bridge.alma, virgil_bridge.alma_gp, virgil_bridge.alma_start], doc: alma_conventions.md}  # MPoL replica: softplus pixels, in-model blur, AdamW, MPoL step counts; replica-vs-MPoL bands (`alma_imlup_maxent.py fit --workflow mpol-replica`)
  virgil_bridge.alma_lambda: {layer: references, depends: [virgil_bridge.alma_start, virgil_bridge.alma_synth], doc: alma_conventions.md}  # the registered IM Lup lambda rule: scatter s^2 (sigma, D4), MEM on sqrt pixels over the D1 grid, dof-corrected discrepancy root, staged nuisances (`alma_imlup_maxent.py lambda-rule`)
  crosscheck.alma_clean: {layer: references, doc: alma_conventions.md}  # numpy multi-scale minor cycles, beam fit, restore, uv taper for the IM Lup CLEAN
  crosscheck.alma_maxent: {layer: references, doc: alma_conventions.md}  # numpy taper, S_M, WCS and FITS for the MaxEnt comparison
  crosscheck.alma_speed: {layer: references, doc: alma_conventions.md}  # virgil's L-BFGS against MPoL's AdamW on IM Lup: objective vs wall time, time to target, cost per pass (numpy only; `alma_imlup_maxent.py speed`)
  mpol: {layer: references, doc: alma_conventions.md}  # the external package itself (problems P11, P12)
  external_bridge.pmoired_models: {layer: references}
  evidence: {layer: references}
  pmoired: {layer: references}  # the external package itself (problems P1-P3)
  orbitize: {layer: references}  # the external package itself (problem P7)
  external_bridge.orbitize_worker: {layer: references, doc: method/orbitize.md}
  external_bridge.orbitize_bridge: {layer: references, depends: [external_bridge.orbitize_worker], doc: method/orbitize.md}
  candid: {layer: references}  # the external package itself (problem P4)
  external_bridge.candid_worker: {layer: references, doc: method/candid.md}
  external_bridge.candid_bridge: {layer: references, depends: [external_bridge.candid_worker], doc: method/candid.md}
  external_bridge.fouriever_worker: {layer: references}
  fouriever: {layer: references}  # the external package itself (problem P5)
  external_bridge.ehtim_worker: {layer: references, doc: method/ehtim.md}
  ehtim: {layer: references}  # the external package itself (problem P6)
  external_bridge.safe_load: {layer: references, doc: method/index.md}
  crosscheck.radial: {layer: references, doc: models/polar_disk.md}
  crosscheck.polar_images: {layer: references, depends: [crosscheck.sky], doc: models/polar_disk.md}
  external_bridge.radial_codes: {layer: references, doc: models/polar_disk.md}
  frank: {layer: references, doc: models/polar_disk.md}  # the external package itself
  visr: {layer: references, doc: models/polar_disk.md}  # vis-r (its ggap profile: P10)
  frap: {layer: references, doc: models/polar_disk.md}
  oimodeler: {layer: references, doc: models/polar_disk.md}  # the external package itself (problem P9)

pipelines:
  synthetic-vlti-fit:
    title: Simulated VLTI data, OIFITS to fitted parameters and uncertainties
    data: simulated
    dataset: four UTs, binaries, disks and rims with noise
    reference: the injected truth
    headline: fits recover the truth; error bars calibrated (pulls)
    steps: [virgil.oifits.read_oifits, virgil.oidata.OIData, virgil.models.System,
            virgil.likelihood.whitened_residuals, virgil.fitting.fit, virgil.inference.laplace_cov]
  dlux-masking-fit:
    title: Aperture-masking images from dLux, calibrated and fitted
    data: simulated
    dataset: dLux images of a 7-hole mask
    reference: the injected truth
    headline: biases of at most 0.05 σ
    steps: [virgil.oifits.read_oifits, virgil.oidata.OIData, virgil.models.System,
            virgil.fitting.fit, virgil.inference.laplace_cov]
  pmoired-identical-fits:
    title: The same files fitted by virgil and PMOIRED
    data: simulated
    dataset: VLTI files, three telescopes
    reference: PMOIRED fits of the same files
    headline: best fits within 0.25 σ
    steps: [virgil.oifits.read_oifits, virgil.oidata.OIData, virgil.models.BinaryModelCartesian,
            virgil.fitting.fit, virgil.inference.laplace_cov]
  rml-imaging:
    title: Regularised image reconstruction against eht-imaging or MPoL on the same data
    data: simulated
    dataset: three VLTI UTs, noisy visibilities of a two-Gaussian scene
    reference: eht-imaging's imager on the same visibilities
    headline: the same minimum, images equal to 1e-7
    steps: [virgil.oidata.OIData, virgil.models.Image, virgil.imaging.TSV,
            virgil.fitting.fit]  # TSV; other regularisers are alternatives, checked alone
  contest-imaging:
    title: Blind images from the SPIE imaging contests' data, against the published entries and truths
    data: real
    dataset: SPIE interferometric imaging contests, 2004–2024
    reference: the contests' truth images and published entries
    url: https://github.com/benjaminpope/virgil-validation/blob/main/design/plan_imaging_contests.md
    headline: images compared with the truths and entries
    state: running
    steps: [virgil.oifits.read_oifits, virgil.oidata.OIData, virgil.models.Image,
            virgil.imaging.TSV, virgil.imaging.MaxEntropy, virgil.imaging.l_curve, virgil.fitting.fit]
  binary-orbits:
    title: Binary orbits from the authors' archival data, solved without starting from the published orbit
    data: real
    dataset: VLTI GRAVITY, PIONIER and AMBER and CHARA MIRC-X archives (OiDB and ESO), e.g. Gl 229 Ba–Bb, 9 Sgr, HD 168137 and 12 Track B binaries
    reference: the published orbits, separations, angles and contrasts, drawn only after the fit
    url: https://github.com/benjaminpope/virgil-validation/blob/main/design/plan_eso_binaries.md
    headline: each orbit on the sky and its elements against the paper, with the period aliases; fits being rerun
    page: orbits/
    state: running  # published binaries fitted; 9 Sgr, HD 168137 and Track B await the blind rerun
    steps: [virgil.oifits.read_oifits, virgil.oidata.OIData, virgil.models.BinaryModelCartesian,
            virgil.grid_fit.likelihood_grid, virgil.fitting.fit, virgil.inference.laplace_cov,
            virgil.limits.absil_limits, virgil.epochs.epoch_positions, virgil.epochs.rank_orbits,
            virgil.models.OrbitalBinary]
  orbitize-posterior:
    title: Posteriors of a published orbit (beta Pic b, orbitize!'s data) against orbitize! with matched priors
    data: real
    dataset: beta Pic b relative astrometry (orbitize! example data; Nielsen et al. 2020)
    reference: orbitize!'s posteriors with matched priors
    headline: percentiles of a, e, i, Omega, omega and P within 0.15 posterior sd
    state: running
    planned: true  # written (tests/test_orbitize.py, tier C), not yet run: hours, for OzSTAR
    steps: [virgil.orbits.PositionData, virgil.orbits.KeplerOrbit]
  alma-imlup:
    title: DSHARP IM Lup Band 6 continuum, measurement sets to a multi-observation image fit
    data: real
    dataset: DSHARP IM Lup Band 6 continuum
    reference: MPoL 04-IMLup-multi-EB; DSHARP II/III
    url: https://github.com/benjaminpope/virgil-validation/blob/main/design/alma_imlup.md
    headline: virgil.radio's objective on the 26 ddids of IM Lup against MPoL's example and an exact DFT
    state: planned  # CI runs tests/test_alma_mpol.py; its IM Lup check is that the objective equals MPoL's and an exact DFT on all 26 ddids. The IM Lup image fit (design P3/P4) has not run
    steps: [virgil.radio.ComplexVisData.read_ms, virgil.radio.ComplexVisData.model, virgil.radio.ComplexVisData.term,
            virgil.radio.primary_beam, virgil.radio.dartboard_folds, virgil.models.Image, virgil.fitting.fit]
