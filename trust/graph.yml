# The trust graph (docs/design.md, "Making it traceable").
#
# nodes: virgil objects (and our own references). For each:
#   layer:    for the chart (models, orbits, data, likelihood, inference, imaging, references)
#   source:   virgil source files it depends on: evidence measured on a
#             virgil commit older than the last change to these is stale
#   depends:  other nodes it is built on; trust propagates upwards only
#   doc:      optional page (and #section) of the docs that explains its checks;
#             otherwise scripts/trust.py finds the topic page that mentions it most
#   roots:    how many independent strong roots it needs (default 1;
#             2 for conventions a model could get wrong in a correlated way).
#             Roots come from one pool (src/evidence/__init__.py): mathematics,
#             standards, statistics, literature, and the trusted packages
#             (dLux, PMOIRED, CANDID, fouriever, eht-imaging, MPoL, orbitize!). Any of
#             them may validate any link; no node needs a particular package.
#
# pipelines: chains of nodes validated end to end, e.g. by reproducing a
# published result from the authors' own data (root: literature). A
# pipeline is validated when its own evidence passes and every step is
# trusted on its own; end-to-end failure with trusted steps points at the
# joins between them. For the Trust page, each also has:
#   data:      real (observations, reproducing a published result) or simulated
#   dataset:   what the data are, in a few words
#   reference: what it is compared with (a paper, a package, the truth)
#   url:       optional link for the reference
#   headline:  what agreement means, shown until evidence gives the number
#   state:     planned or running, while there is no evidence yet

nodes:
  # ---------------------------------------------------------------- data
  virgil.oifits.read_oifits:
    layer: data
    source: [src/virgil/oifits.py]
    roots: 2  # OIFITS conventions: standards and another reader
    doc: data/long_baseline.md
  virgil.oidata.OIData:
    layer: data
    source: [src/virgil/oidata.py, src/virgil/_closure.py]
    depends: [virgil.oifits.read_oifits]
  virgil.oidata.find_uv_grid:
    layer: data
    source: [src/virgil/_geometry.py]
  virgil.coverage.vlti_oidata:
    layer: data
    source: [src/virgil/coverage.py]
  virgil.amigo.load_oi_data:
    layer: data
    source: [src/virgil/amigo.py]
    depends: [virgil.oidata.OIData]
    doc: method/coverage.md

  # -------------------------------------------------------------- models
  virgil.models.PointSource: {layer: models, source: [src/virgil/models.py]}
  virgil.models.GaussianDisk: {layer: models, source: [src/virgil/models.py]}
  virgil.models.EllipticalGaussian: {layer: models, source: [src/virgil/models.py]}
  virgil.models.UniformDisk: {layer: models, source: [src/virgil/models.py]}
  virgil.models.ModulatedGaussianRim: {layer: models, source: [src/virgil/models.py], roots: 2}
  virgil.models.GaussianArc: {layer: models, source: [src/virgil/models.py]}
  virgil.models.BinaryModelCartesian: {layer: models, source: [src/virgil/models.py], roots: 2}
  virgil.models.BinaryModelAngular: {layer: models, source: [src/virgil/models.py]}
  virgil.models.Image: {layer: models, source: [src/virgil/models.py]}
  virgil.models.Image.model_on_grid: {layer: models, source: [src/virgil/models.py, src/virgil/_geometry.py], depends: [virgil.models.Image]}
  virgil.models.Image.from_model: {layer: models, source: [src/virgil/models.py], depends: [virgil.models.Image]}
  virgil.models.SourceModel.render: {layer: models, source: [src/virgil/models.py]}
  virgil.models.Resolved: {layer: models, source: [src/virgil/models.py]}
  virgil.models.Rotated: {layer: models, source: [src/virgil/models.py]}
  virgil.models.System:
    layer: models
    source: [src/virgil/models.py]
    depends: [virgil.models.PointSource, virgil.models.GaussianDisk, virgil.models.UniformDisk]
  virgil.models.GravityDarkenedStar:
    layer: models
    source: [src/virgil/models.py, src/virgil/_elr.py]
    depends: [virgil._elr]
  virgil.models.cvis_limb_darkened_disk: {layer: models, source: [src/virgil/models.py]}
  virgil.models.LimbDarkenedDisk:
    layer: models
    source: [src/virgil/models.py]
    depends: [virgil.models.cvis_limb_darkened_disk]
  virgil.models.QuadraticLimbDarkenedDisk:
    layer: models
    source: [src/virgil/models.py]
    depends: [virgil.models.cvis_limb_darkened_disk]
  virgil.models.SquareRootLimbDarkenedDisk:
    layer: models
    source: [src/virgil/models.py]
    depends: [virgil.models.cvis_limb_darkened_disk]
  virgil.models.FlaredDiskGaussian: {layer: models, source: [src/virgil/models.py]}
  virgil.models.FlaredDiskHG: {layer: models, source: [src/virgil/models.py]}
  virgil.models.FlaredDiskPowerLaw: {layer: models, source: [src/virgil/models.py]}
  virgil.models.HarmonixModel: {layer: models, source: [src/virgil/models.py], doc: models/flared_disks.md#the-harmonix-wrapper}
  virgil.spectra.PowerLaw: {layer: models, source: [src/virgil/spectra.py]}
  virgil.spectra.BlackBody: {layer: models, source: [src/virgil/spectra.py]}
  virgil.spectra.Tabulated: {layer: models, source: [src/virgil/spectra.py]}

  # ----------------------------------------------------------- likelihood
  virgil.oidata.OIData.cp_noise:  # correlated closure phases (Kammerer et al. 2020)
    layer: likelihood
    source: [src/virgil/_closure.py]
    roots: 2  # mathematics and fouriever
  virgil.likelihood.whitened_residuals:
    layer: likelihood
    source: [src/virgil/likelihood.py, src/virgil/_closure.py]
    depends: [virgil.oidata.OIData, virgil.oidata.OIData.cp_noise]
    doc: likelihood/closure_phases.md
  virgil.likelihood.model_loglike:
    layer: likelihood
    source: [src/virgil/likelihood.py]
    depends: [virgil.likelihood.whitened_residuals]
    doc: likelihood/linear_marginals.md
  virgil.fitting.fit:
    layer: likelihood
    source: [src/virgil/fitting.py, src/virgil/_precision.py]
    depends: [virgil.likelihood.model_loglike]
    doc: data/long_baseline.md

  # ------------------------------------------------------------ inference
  virgil.inference.laplace_cov:
    layer: inference
    source: [src/virgil/inference.py]
    depends: [virgil.likelihood.model_loglike]
  virgil.grid_fit.likelihood_grid:
    layer: inference
    roots: 2  # mathematics and CANDID
    source: [src/virgil/grid_fit.py, src/virgil/_grid.py]
    depends: [virgil.likelihood.model_loglike]
  virgil.grid_fit.optimized_flux_grid:
    layer: inference
    source: [src/virgil/grid_fit.py, src/virgil/_grid.py]
    depends: [virgil.likelihood.model_loglike]
  virgil.grid_fit.laplace_flux_uncertainty_grid:
    layer: inference
    source: [src/virgil/grid_fit.py, src/virgil/_grid.py, src/virgil/inference.py]
    depends: [virgil.likelihood.model_loglike]
  virgil.grid_fit.linear_flux_grid:
    layer: inference
    source: [src/virgil/grid_fit.py, src/virgil/_grid.py]
    depends: [virgil.likelihood.whitened_residuals]
  virgil.priors.IsotropicInclination: {layer: priors, source: [src/virgil/priors.py]}
  virgil.priors.IsotropicLatitude: {layer: priors, source: [src/virgil/priors.py]}
  virgil.angles.AngleVector: {layer: priors, source: [src/virgil/angles.py], doc: likelihood/priors.md}
  virgil.oifits.write_oifits: {layer: data, source: [src/virgil/oifits.py]}
  virgil.observables.continuum_operator: {layer: data, source: [src/virgil/observables.py]}
  virgil.observables.VisibilityAmplitude:
    layer: likelihood
    source: [src/virgil/observables.py]
    depends: [virgil.oidata.OIData]
  virgil.observables.TripleAmplitude:
    layer: likelihood
    source: [src/virgil/observables.py]
    depends: [virgil.oidata.OIData]
  virgil.spectra.Nodes: {layer: models, source: [src/virgil/spectra.py]}
  virgil.spectra.GaussianLine: {layer: models, source: [src/virgil/spectra.py]}
  virgil.spectra.LorentzianLine: {layer: models, source: [src/virgil/spectra.py]}
  virgil.spectra.Sum: {layer: models, source: [src/virgil/spectra.py]}
  virgil.orbits.starting_orbits:
    layer: orbits
    source: [src/virgil/orbits.py]
    depends: [virgil.orbits.PositionData]
  virgil.orbits.AxialVonMises: {layer: orbits, source: [src/virgil/orbits.py]}
  virgil.orbits.orientation_priors: {layer: orbits, source: [src/virgil/orbits.py], depends: [virgil.angles.AngleVector]}
  virgil.orbits.orientation_from_varpi: {layer: orbits, source: [src/virgil/orbits.py]}
  virgil.orbits.position_angle_log_jacobian: {layer: orbits, source: [src/virgil/orbits.py]}
  virgil.models.Attached:
    layer: models
    source: [src/virgil/models.py, src/virgil/orbits.py]
    depends: [virgil.orbits.KeplerOrbit]
  virgil.limits.injection_limits:
    layer: inference
    source: [src/virgil/limits.py, src/virgil/_grid.py]
    depends: [virgil.likelihood.model_loglike, virgil.limits.nsigma]
  virgil.detection.detection_statistics:
    layer: inference
    source: [src/virgil/detection.py, src/virgil/grid_fit.py, src/virgil/_grid.py]
    depends: [virgil.likelihood.model_loglike]
    doc: inference/detection.md
  virgil.detection.local_nsigma: {layer: inference, source: [src/virgil/detection.py], depends: [virgil.limits.nsigma]}
  virgil.detection.gaussian_null:
    layer: inference
    source: [src/virgil/detection.py, src/virgil/oidata.py]
    depends: [virgil.oidata.OIData]
    doc: inference/detection.md
  virgil.detection.injection_recovery:
    layer: inference
    source: [src/virgil/detection.py]
    depends: [virgil.detection.detection_statistics, virgil.detection.gaussian_null, virgil.detection.DetectionMC]
    doc: inference/grid_limits.md#false-alarm-and-contrast-calibration-campaign
  virgil.detection.DetectionMC: {layer: inference, source: [src/virgil/detection.py]}
  virgil.limits.flux_to_contrast: {layer: inference, source: [src/virgil/limits.py]}
  virgil.limits.flux_to_delta_mag: {layer: inference, source: [src/virgil/limits.py]}
  virgil.models.TruncatedCone: {layer: models, source: [src/virgil/models.py]}
  virgil.models.SourceModel: {layer: models, source: [src/virgil/models.py]}
  virgil.fields.field_spectrum: {layer: priors, source: [src/virgil/fields.py]}
  virgil.fields.GaussianField:
    layer: priors
    source: [src/virgil/fields.py]
    depends: [virgil.fields.field_spectrum]
  virgil.grid_fit.best_grid_point: {layer: inference, source: [src/virgil/grid_fit.py]}
  virgil.likelihood.build_model: {layer: likelihood, source: [src/virgil/likelihood.py]}
  virgil.likelihood.loglike:
    layer: likelihood
    source: [src/virgil/likelihood.py]
    depends: [virgil.likelihood.model_loglike, virgil.likelihood.build_model]
  virgil.likelihood.inflated_errors: {layer: likelihood, source: [src/virgil/likelihood.py, src/virgil/_utils.py], depends: [virgil.oidata.OIData]}
  virgil.inference.fisher:
    layer: inference
    source: [src/virgil/inference.py]
    depends: [virgil.likelihood.model_loglike]
  virgil.simulate.simulate:
    layer: data
    source: [src/virgil/simulate.py, src/virgil/oidata.py]
    depends: [virgil.oidata.OIData]
  virgil.simulate.bias_test:
    layer: inference
    source: [src/virgil/simulate.py]
    depends: [virgil.simulate.simulate, virgil.fitting.fit]
  virgil.observables.FluxSpectrum:
    layer: likelihood
    source: [src/virgil/observables.py, src/virgil/_linear.py]
    depends: [virgil.oidata.OIData, virgil._linear]
  virgil.oidata.OIData.with_flux_scale: {layer: data, source: [src/virgil/oidata.py], depends: [virgil.observables.FluxSpectrum], doc: likelihood/spectra_phases.md}
  virgil.observables.DifferentialPhase:
    layer: likelihood
    # recheck when virgil#232 (cached Cholesky) lands
    source: [src/virgil/observables.py, src/virgil/_linear.py]
    depends: [virgil.oidata.OIData, virgil.observables.continuum_operator, virgil._linear]
  virgil.oidata.OIData.with_continuum: {layer: data, source: [src/virgil/oidata.py], depends: [virgil.observables.DifferentialPhase], doc: likelihood/spectra_phases.md}
  virgil._linear:  # analytic marginalisation of linear parameters: LinearMarginal, posterior, whiten_*
    layer: likelihood
    source: [src/virgil/_linear.py]
  virgil.gains.gain_modes:  # analytic marginalisation of calibration gains
    layer: likelihood
    source: [src/virgil/gains.py, src/virgil/likelihood.py]
    depends: [virgil.oidata.OIData, virgil._linear]
    doc: likelihood/linear_marginals.md
  virgil.gains.closure_offsets:  # analytic marginalisation of closure-phase offsets
    layer: likelihood
    source: [src/virgil/gains.py, src/virgil/likelihood.py]
    depends: [virgil.oidata.OIData, virgil.oidata.OIData.cp_noise, virgil._linear]
    doc: likelihood/linear_marginals.md
  virgil.limits.nsigma:
    layer: inference
    roots: 2  # mathematics and CANDID
    source: [src/virgil/limits.py]
  virgil.limits.absil_limits:
    layer: inference
    roots: 2  # mathematics and CANDID
    source: [src/virgil/limits.py, src/virgil/_grid.py]
    depends: [virgil.likelihood.model_loglike, virgil.limits.nsigma]
  virgil.limits.ruffio_upperlimit:
    layer: inference
    source: [src/virgil/limits.py]
    depends: [virgil.grid_fit.optimized_flux_grid, virgil.grid_fit.laplace_flux_uncertainty_grid]
  virgil.likelihood.numpyro_model:
    layer: inference
    source: [src/virgil/likelihood.py]
    depends: [virgil.likelihood.model_loglike]

  # -------------------------------------------------------------- imaging
  virgil.imaging.dirty_image: {layer: imaging, source: [src/virgil/imaging.py], depends: [virgil.oidata.OIData]}
  virgil.imaging.beam: {layer: imaging, source: [src/virgil/imaging.py], depends: [virgil.oidata.OIData]}
  virgil.imaging.nyquist_pixel_scale: {layer: imaging, source: [src/virgil/imaging.py]}
  virgil.imaging.field_of_view: {layer: imaging, source: [src/virgil/imaging.py]}
  virgil.imaging.convolve_beam: {layer: imaging, source: [src/virgil/imaging.py]}
  # regularised imaging: natural roots are eht-imaging and MPoL
  virgil.imaging.clean: {layer: imaging, source: [src/virgil/imaging.py], depends: [virgil.likelihood.whitened_residuals], doc: imaging/machinery.md}
  virgil.imaging.TSV: {layer: imaging, source: [src/virgil/imaging.py]}
  virgil.imaging.TV: {layer: imaging, source: [src/virgil/imaging.py]}
  virgil.imaging.MaxEntropy: {layer: imaging, source: [src/virgil/imaging.py]}
  virgil.imaging.Laplacian: {layer: imaging, source: [src/virgil/imaging.py]}
  virgil.imaging.StarletL1: {layer: imaging, source: [src/virgil/imaging.py]}
  virgil.imaging.LogSum: {layer: imaging, source: [src/virgil/imaging.py]}
  virgil.imaging.l_curve:
    layer: imaging
    source: [src/virgil/imaging.py]
    depends: [virgil.fitting.fit]

  # -------------------------------------------------------------- orbits
  # Grounded on orbitize! (Blunt et al. 2020, 2024) and on mathematics (the
  # documented symmetries) and standards (IAU constants): tests/test_orbitize.py
  virgil.orbits.KeplerOrbit:
    layer: orbits
    source: [src/virgil/orbits.py]
    roots: 2  # conventions (omega, Omega, sense of rotation, dz): orbitize! and mathematics
  virgil.orbits.ThieleInnesOrbit:
    layer: orbits
    source: [src/virgil/orbits.py]
    depends: [virgil.orbits.KeplerOrbit]
  virgil.orbits.StateVectorOrbit:
    layer: orbits
    source: [src/virgil/orbits.py]
    depends: [virgil.orbits.KeplerOrbit]
  virgil.orbits.total_mass:
    layer: orbits
    source: [src/virgil/orbits.py]
    depends: [virgil.orbits.KeplerOrbit]
  virgil.orbits.distance_pc:
    layer: orbits
    source: [src/virgil/orbits.py]
    depends: [virgil.orbits.KeplerOrbit]
  virgil.orbits.PositionData:
    layer: orbits
    source: [src/virgil/orbits.py]
    depends: [virgil.orbits.KeplerOrbit]
    doc: orbits/kepler.md
  virgil.orbits.RVData:
    layer: orbits
    source: [src/virgil/orbits.py]
    depends: [virgil.orbits.KeplerOrbit, virgil._linear]
    roots: 2  # RV signs: orbitize! and mathematics

  virgil._elr:
    layer: models
    source: [src/virgil/_elr.py]
    doc: models/rapid_rotators.md

  # --------------------------------------------- our references (links)
  crosscheck: {layer: references}
  crosscheck.sky: {layer: references}
  crosscheck.limb: {layer: references}
  crosscheck.elr: {layer: references}
  crosscheck.nrm: {layer: references}
  external_bridge: {layer: references}
  external_bridge.pmoired_models: {layer: references}
  evidence: {layer: references}
  pmoired: {layer: references}  # the external package itself (problems P1-P3)
  orbitize: {layer: references}  # the external package itself (problem P7)
  external_bridge.orbitize_bridge: {layer: references}
  candid: {layer: references}  # the external package itself (problem P4)
  external_bridge.candid_bridge: {layer: references}
  external_bridge.fouriever_worker: {layer: references}
  fouriever: {layer: references}  # the external package itself (problem P5)
  ehtim: {layer: references}  # the external package itself (problem P6)

pipelines:
  synthetic-vlti-fit:
    title: Simulated VLTI data, OIFITS to fitted parameters and uncertainties
    data: simulated
    dataset: four UTs, binaries, disks and rims with noise
    reference: the injected truth
    headline: fits recover the truth; error bars calibrated (pulls)
    steps: [virgil.oifits.read_oifits, virgil.oidata.OIData, virgil.models.System,
            virgil.likelihood.whitened_residuals, virgil.fitting.fit, virgil.inference.laplace_cov]
  dlux-masking-fit:
    title: Aperture-masking images from dLux, calibrated and fitted
    data: simulated
    dataset: dLux images of a 7-hole mask
    reference: the injected truth
    headline: biases of at most 0.05 σ
    steps: [virgil.oifits.read_oifits, virgil.oidata.OIData, virgil.models.System,
            virgil.fitting.fit, virgil.inference.laplace_cov]
  pmoired-identical-fits:
    title: The same files fitted by virgil and PMOIRED
    data: simulated
    dataset: VLTI files, three telescopes
    reference: PMOIRED fits of the same files
    headline: best fits within 0.25 σ
    steps: [virgil.oifits.read_oifits, virgil.oidata.OIData, virgil.models.BinaryModelCartesian,
            virgil.fitting.fit, virgil.inference.laplace_cov]
  rml-imaging:
    title: Regularised image reconstruction against eht-imaging or MPoL on the same data
    data: simulated
    dataset: three VLTI UTs, noisy visibilities of a two-Gaussian scene
    reference: eht-imaging's imager on the same visibilities
    headline: the same minimum, images equal to 1e-7
    steps: [virgil.oidata.OIData, virgil.models.Image, virgil.imaging.TSV,
            virgil.fitting.fit]  # TSV; other regularisers are alternatives, checked alone
  contest-imaging:
    title: Blind images from the SPIE imaging contests' data, against the published entries and truths
    data: real
    dataset: SPIE interferometric imaging contests, 2004–2024
    reference: the contests' truth images and published entries
    url: https://github.com/benjaminpope/virgil-validation/blob/main/design/plan_imaging_contests.md
    headline: images compared with the truths and entries
    state: running
    steps: [virgil.oifits.read_oifits, virgil.oidata.OIData, virgil.models.Image,
            virgil.imaging.TSV, virgil.imaging.MaxEntropy, virgil.imaging.l_curve, virgil.fitting.fit]
  published-binary:
    title: Reproduce published binary detections from the authors' archival data
    data: real
    dataset: ESO archive, e.g. Gl 229 Ba–Bb and NACO aperture-masking binaries
    reference: the published separations, angles and contrasts
    url: https://github.com/benjaminpope/virgil-validation/blob/main/design/plan_eso_binaries.md
    headline: separation, angle and contrast against the papers
    state: running
    steps: [virgil.oifits.read_oifits, virgil.oidata.OIData, virgil.models.BinaryModelCartesian,
            virgil.grid_fit.likelihood_grid, virgil.fitting.fit, virgil.inference.laplace_cov,
            virgil.limits.absil_limits]
  orbitize-posterior:
    title: Posteriors of a published orbit (beta Pic b, orbitize!'s data) against orbitize! with matched priors
    data: real
    dataset: beta Pic b relative astrometry (orbitize! example data; Nielsen et al. 2020)
    reference: orbitize!'s posteriors with matched priors
    headline: percentiles of a, e, i, Omega, omega and P within 0.15 posterior sd
    state: running
    planned: true  # written (tests/test_orbitize.py, tier C), not yet run: hours, for OzSTAR
    steps: [virgil.orbits.PositionData, virgil.orbits.KeplerOrbit]
