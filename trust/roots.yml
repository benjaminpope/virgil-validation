# The roots of trust: what each is, why we believe it, and what it cannot catch.
#
# One entry per root the trust engine knows (`ROOTS` in src/evidence/__init__.py,
# `ROOT_NAMES`, `EXTERNAL` and `ROOT_ALIAS` in scripts/trust.py), plus `golden`,
# the engine's single root for all golden sources (`GOLDEN`, trust/golden.yml).
# tests/test_roots_registry.py keeps this file and those constants in step.
#
# Fields per root: id, class (a key of `classes:`), what, why,
# cannot_catch, citation and url (only from a source in this repository, else
# empty), reviewed. A root has no `name` here: its label on the Trust page is
# `ROOT_NAMES` in scripts/trust.py, the one source, so a root never shows under
# two labels. (`classes:` and `links:` have no engine label, so they keep `name`.)
#
# `counts_as` marks a root counted under another (`ROOT_ALIAS`).
# `reviewed: false` means the text is a draft; Ben flips it
# to true after editing. Text is drafted from what the repository says
# (docs/method/, docs/models/polar_disk.md, docs/alma_conventions.md,
# pyproject.toml, scripts/setup_external.sh, trust/golden.yml).
#
# `classes:` gives the same text fields for each class. `links:` lists things
# that appear next to the roots but are not roots and are never counted as
# roots (docs/method/index.md, principle 2). "virgil against itself" is not a
# link: the engine knows it as the weak root `self-consistency`.

classes:
  mathematics:
    name: Mathematics
    what: "A result that can be written on paper: the Airy pattern, the shift theorem, a Gaussian integral, a quadrature. Evaluated with NumPy and SciPy."
    why: "The result is textbook, and the libraries that evaluate it are mature and written by people."
    cannot_catch: "The test's transcription of the formula is written by an agent. A convention misread the same way on both sides passes unnoticed, which is why sky conventions need a second root."
  statistics:
    name: Statistics
    what: "Ensembles whose distribution is known in advance: pulls that must be N(0, 1), uniform rank histograms, coverage of credible intervals."
    why: "The truth is set by the simulation, so no reference implementation is needed."
    cannot_catch: "A finite ensemble with a wide band passes a small bias. It says nothing about conventions."
  standards:
    name: Standards
    what: "Published definitions: OIFITS v1 and v2, position angle North through East, uv geometry from Thompson, Moran & Swenson."
    why: "They are the documents the data and the other codes already follow."
    cannot_catch: "We read the standard ourselves. Where its text is ambiguous, the reading is ours."
  other-peoples-code:
    name: Other people's code
    what: "PMOIRED, CANDID, dLux, fouriever, eht-imaging, MPoL, orbitize!, CASA, frank, FRAP, vis-r, oimodeler, each run as released: some in their own environment and subprocess, some installed beside virgil (eht-imaging carries a runtime NumPy 2 workaround, P6)."
    why: "Written by other people, used in published science, and sharing no code with virgil."
    cannot_catch: "They have bugs too: 14 are documented here (P1–P14). Two codes can share a community-wide mistake."
  published-results:
    name: Published results
    what: "Numbers reproduced from the authors' own data: an orbit, a diameter, an image."
    why: "End to end, so it tests the joins between parts that unit checks cannot."
    cannot_catch: "Papers can be wrong, and agreement is only as fine as the published errors."
  golden-values:
    name: Golden values
    what: "Reference numbers produced by someone else's code and stored here, listed in trust/golden.yml. All golden sources together count as one root."
    why: "The numbers come from another person's implementation, so they are not ours. Each source records which code, version or commit produced them."
    cannot_catch: "They are values, not a method: they cannot be rerun on a new case. They check only the cases that were stored, and a source can be wrong or out of date."
  self-consistency:
    name: Self-consistency
    what: "virgil against itself: a check of one part of virgil against another part, and virgil's own test suite (its CI records, which the engine counts under \"virgil's own tests\"). Recorded as the weakest root, never counted as a strong one."
    why: "It does catch a part that disagrees with itself: a regression, a broken round trip, a shape or finiteness failure."
    cannot_catch: "Anything the authors got wrong consistently. It is weak evidence and is never enough on its own for a verdict."

# Not roots. Never counted as roots; never in ROOTS.
links:
  reference-code:
    name: Our reference code
    what: "The independent implementations in `crosscheck` and `external_bridge`. (`virgil_bridge` is the adapter that calls virgil, not a reference.)"
    why: "A link, not a root: each reference must itself agree with a root by a second route (for example quadrature against a closed form) before it may judge virgil, and it must never import or copy virgil."
    cannot_catch: "Written by agents, so trusted only as far as its own checks. A mistake it shares with its own root passes."
    reviewed: false

roots:
  - id: mathematics
    class: mathematics
    what: "Closed-form results (Fourier transforms of Gaussians and disks, the shift and convolution theorems, the Airy pattern, quadratures) checked numerically with NumPy, SciPy (Cephes Bessel functions) and mpmath."
    why: "The results are textbook and the libraries that evaluate them are mature. When roots disagree, mathematics decides (docs/method/index.md, principle 4)."
    cannot_catch: "A formula transcribed in the test by an agent. A convention misread the same way on both sides passes, so sky conventions need a second root. The legacy record name 'render' is counted here."
    citation: ""
    url: ""
    reviewed: false

  - id: standards
    class: standards
    what: "Published definitions: OIFITS v1 and v2, position angle North through East, Earth-rotation uv geometry from Thompson, Moran & Swenson."
    why: "The data and the other codes already follow these documents."
    cannot_catch: "Our reading of the text. Where the standard is ambiguous the reading is ours, and it cannot confirm a convention that virgil's own documentation took from elsewhere."
    citation: "Pauls et al. 2005, PASP 117, 1255 (OIFITS); Duvert et al. 2017, A&A 597, A8 (OIFITS v2); Thompson, Moran & Swenson 2017, ch. 4"
    url: ""
    reviewed: false

  - id: statistics
    class: statistics
    what: "Ensembles of simulations whose distribution is known: pulls of fit minus truth over sigma, which must be N(0, 1); rank histograms; credible-interval coverage."
    why: "The simulation sets the truth, so no reference implementation is needed."
    cannot_catch: "A small bias hidden by a wide band on a finite ensemble. Conventions: the simulation and the fit can share one."
    citation: ""
    url: ""
    reviewed: false

  - id: dlux
    class: other-peoples-code
    what: "A differentiable optical-modelling package in JAX. Simulates aperture-masking interferograms independently of virgil."
    why: "Written by other authors; its masking data are compared with a closed-form interferogram, and the two must agree (docs/method/index.md)."
    cannot_catch: "Its own bugs, and any optics convention virgil and dLux share. Installed as a dependency (`dLux>=0.15` in pyproject.toml), not a separate environment."
    citation: "Desdoigts et al. 2023"
    url: "https://github.com/LouisDesdoigts/dLux"
    reviewed: false

  - id: pmoired
    class: other-peoples-code
    what: "The OIFITS model-fitting code of A. Mérand. The root for virgil's interferometric models, visibilities and fits."
    why: "Written and used by other people, and pinned (`pmoired==26.10.1` in pyproject.toml). Sharing no code with virgil."
    cannot_catch: "Its own bugs: P1, P2 and P3 are documented (docs/method/pmoired.md). When it disagrees with a closed form, mathematics wins."
    citation: "Mérand 2022"
    url: "https://github.com/amerand/PMOIRED"
    reviewed: false

  - id: candid
    class: other-peoples-code
    what: "The companion-detection code of A. Mérand and A. Gallenne: `fitMap`, `detectionLimit` (the Absil method). The root for virgil's detection limits and companion search."
    why: "Written and used by other people. Pinned to commit c255e90 (version 1.1.0; no PyPI release). It runs in its own environment, called through `src/external_bridge/candid_bridge.py` in a subprocess."
    cannot_catch: "Its own bugs: P4 is documented (docs/method/candid.md). Statistical conventions the two codes share."
    citation: "Absil et al. 2011, A&A 535, A68; Gallenne et al. 2015, A&A 579, A68"
    url: "https://github.com/amerand/CANDID"
    reviewed: false

  - id: fouriever
    class: other-peoples-code
    what: "The code of J. Kammerer (Kammerer et al. 2020) whose model of correlated closure phases virgil adopts. The root for `OIData.cp_noise`."
    why: "Written by other authors. It states no licence, so it is pinned (0.4.3) in its own environment and run in a subprocess."
    cannot_catch: "Its own bugs: P5 (raised as fouriever#26) and P8 are documented (docs/method/fouriever.md, trust/ledger.yml). It checks only the part of the likelihood virgil adopted from it."
    citation: "Kammerer et al. 2020, A&A 644, A110"
    url: "https://github.com/kammerje/fouriever"
    reviewed: false

  - id: orbitize
    class: other-peoples-code
    what: "The orbit-fitting package of the direct-imaging community. The root for `virgil.orbits`: ephemerides, radial velocities, the symmetries of visual orbits, and masses and distances from Kepler's third law."
    why: "Written and used by other people. Pinned (3.4.0) in its own environment and run in a subprocess, called and never vendored."
    cannot_catch: "Its own bugs: P7 is documented (docs/method/orbitize.md). It does not check fits to real data, only the forward model and conventions."
    citation: "Blunt et al. 2020, AJ 159, 89; Blunt et al. 2024, JOSS 9, 6756"
    url: "https://github.com/sblunt/orbitize"
    reviewed: false

  - id: ehtim
    class: other-peoples-code
    what: "The regularised maximum-likelihood imager of the Event Horizon Telescope Collaboration (A. Chael et al.). The root for virgil's image model, image regularisers and RML imaging pipeline."
    why: "Written and used by other people. Pinned (1.3.2) in its own environment and run in a subprocess. Objective values agree to 1e-12 and gradients to 1e-9 in `tests/test_ehtim_reconstruction.py`."
    cannot_catch: "Its own bugs: P6 is documented (docs/method/ehtim.md). It has no OIFITS reader, so the file readers are not checked by it."
    citation: "Chael et al. 2016, ApJ 829, 11; Chael et al. 2018, ApJ 857, 23"
    url: "https://github.com/achael/eht-imaging"
    reviewed: false

  - id: mpol
    class: other-peoples-code
    what: "Regularised-maximum-likelihood imaging for radio interferometry in PyTorch (Czekala et al.): gridding, Fourier transforms, the log-likelihood. The root for ALMA imaging and visibility conventions."
    why: "Written and used by other people. Pinned (0.3.1) in its own environment and run in a subprocess."
    cannot_catch: "Its own bugs: P11 and P12 are documented (docs/method/findings.md). It is a radio code, so it says nothing about optical-interferometry conventions."
    citation: "Czekala et al. 2025, arXiv:2502.00100; Zawadzki et al. 2023, PASP 135, 064503"
    url: "https://github.com/MPoL-dev/MPoL"
    reviewed: false

  - id: casa
    class: other-peoples-code
    what: "The NRAO radio-astronomy package (casatools, casatasks). Its `simulator` and `predict` put known sources into a synthetic measurement set, which fixes the sign of u and the conjugation convention. It is also the root for `virgil.radio.ComplexVisData.read_ms` (against raw `casatools.table` columns) and for `virgil.radio_clean.clean` and `fit_beam` (against `casatasks.tclean`); `casatools` is installed in virgil's interpreter for `read_ms`."
    why: "Written and used by other people; the standard package for ALMA data. Pinned (casatools 6.7.0.31) in the `alma` environment."
    cannot_catch: "Its own bugs, and the measurement-set definition is read by us (docs/alma_conventions.md): it is the root for what CASA does, not for what the telescope measured."
    citation: ""
    url: ""
    reviewed: false

  - id: frank
    class: other-peoples-code
    what: "A discrete Hankel transform of radial brightness profiles (Jennings et al. 2020, with the Baddour & Chouinard 2015 matrix). The root for virgil's radial-profile forward transforms. Counted with FRAP as one root."
    why: "Written and used by other people. Pinned (`frank==1.2.3`, polar-disk extra in pyproject.toml) and called as documented from `src/external_bridge/radial_codes.py`. frank and FRAP agree to about 1e-16 for the same Rmax and N, so together they make one independent root."
    cannot_catch: "It cannot represent a discontinuous profile (D10 in docs/models/polar_disk.md). Sharing one matrix with FRAP, the two cannot check each other's transform."
    citation: "Jennings et al. 2020"
    url: ""
    reviewed: false

  - id: frap
    class: other-peoples-code
    counts_as: frank
    what: "A Fourier-Bessel Hankel matrix code (Yoshida et al., package `astro-frap`). Records under this name are counted under frank (`ROOT_ALIAS`)."
    why: "Written by other people. Pinned (`astro-frap==1.0.2`). It applies the same Baddour-Chouinard matrix on the J0 zeros as frank, so it is not independent of frank."
    cannot_catch: "Anything frank also misses, since the two share a transform. Counted once."
    citation: "Yoshida et al."
    url: ""
    reviewed: false

  - id: visr
    class: other-peoples-code
    what: "Radial-profile visibility modelling (Kennedy 2025). Builds frank's matrix on a grid of baselines; used for the HR 4796 check and as a forward-transform comparison."
    why: "Written by another author and pinned to a commit (f53467077b04878986c967b501d88c54ff3efb86 in pyproject.toml). Called from `src/external_bridge/radial_codes.py`."
    cannot_catch: "Its own bugs: P10 is documented ('r_prof_erf2_power_ggap' mixes up depth and radius, docs/models/polar_disk.md). It builds on frank, so it is not fully independent of it."
    citation: "Kennedy 2025"
    url: "https://github.com/drgmk/vis-r"
    reviewed: false

  - id: oimodeler
    class: other-peoples-code
    what: "A Fourier-space and image-based model-building package for optical interferometry (Meilland et al.). The root for ring and disk components of the polar-disk models."
    why: "Written and used by other people. Pinned (`oimodeler==0.8.1`, polar-disk extra in pyproject.toml)."
    cannot_catch: "Its own bugs: P9 is documented (its `ExpRing` is 8e-3 from its documented profile, unexplained, docs/models/polar_disk.md); P13 and P14 are documented for its `oimFastRotator` (docs/models/rapid_rotators.md). Conventions it shares with virgil."
    citation: "Meilland et al."
    url: ""
    reviewed: false

  - id: literature
    class: published-results
    what: "Numbers reproduced from the authors' own data and published values: orbits, diameters, images. Used by the binary, orbit and contest tests. Engine id `literature`."
    why: "End to end, so it tests the joins between parts that unit checks cannot. A formula we transcribed from a paper is mathematics, not this root."
    cannot_catch: "Papers can be wrong, and agreement is only as fine as the published errors."
    citation: ""
    url: ""
    reviewed: false

  - id: golden
    class: golden-values
    what: "Numbers produced by other people's code and stored here (tests mark them `golden:<name>`). Listed in trust/golden.yml: dholakia (GravityDarkenedStar visibilities and ELR11 fluxes, from jax-interferometry commit 70689ed) and visread (MS reading as MPoL's reader sees it, visread 0.0.5). Engine constant `GOLDEN`; not in `ROOTS`."
    why: "The numbers come from another person's implementation. A golden marker counts only if its source is listed in trust/golden.yml, and every source together counts as one root, because they are values and not an independent method."
    cannot_catch: "Only the stored cases are checked. A source can be wrong, and nothing is rerun on a new case."
    citation: ""
    url: ""
    reviewed: false

  - id: self-consistency
    class: self-consistency
    what: "Tests that check virgil against virgil (round trips, regressions, finiteness) and virgil's own test suite (`VIRGIL_CI`, \"virgil's own tests\"). In ROOTS and in `WEAK`: recorded as weak evidence, never counted as a strong root."
    why: "It still catches a part that disagrees with itself, and breakage in virgil's own code. It is written by people and agents who can read the implementation."
    cannot_catch: "Anything the authors got wrong consistently. Never enough on its own for a verdict."
    citation: ""
    url: ""
    reviewed: false
