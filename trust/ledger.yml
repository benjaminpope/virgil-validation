# The mismatch ledger (docs/design.md): every disagreement found, its ruling
# and how it was refereed.
#
# ruling: virgil | external:<package> | definition | crosscheck
#   virgil       virgil was wrong (code or documentation)
#   external:X   the other package was wrong (raise upstream in batches,
#                with Ben's approval)
#   definition   both right, defined differently: the mapping is documented
#   crosscheck   our own reference or test code was wrong
# status: fixed | open | documented | to-raise | raised
# evidence: test ids (file::name) that pin the behaviour

