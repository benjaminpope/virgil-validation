- id: F25
  title: MultipoleField with r_min_mas = 0 tapers non-zero azimuthal modes by the radial node spacing instead of the physical correlation length length_r, so the prior covariance drifts when n_r is refined
  objects: [virgil.fields.MultipoleField]
  ruling: virgil
  kind: 'discretization (at virgil d79696de9d97, MultipoleField(r_min_mas=0) multiplies harmonic order m by tanh(r / spacing)^|m| with spacing = r_max_mas / (n_r - 1) instead of tanh(r / length_r)^|m|; at r_max_mas = 20, length_r = 7, doubling the grid from n_r = 9 to 17 shifts the induced polar covariance at identical physical radii by 0.275 sigma^2 and misses the length_r-tapered covariance by 0.402 sigma^2. Fixed upstream in virgil 5ca955ad6ceb, where the test passes to 1e-6 and n_r = 9 vs 17 agrees to 1e-15; flip status to fixed when VIRGIL_REF advances past 5ca955ad6ceb)'
  referee: mathematics (resolution-invariant polar Gaussian-process covariance with physical length_r Zernike-type origin regularity)
