  referee: crosscheck (the comparison against the published orbit, docs/orbits/aliases.md); no independent second review yet
  evidence: []
  pending: 'applied in scripts/oidb_fit.py (GL229_EXCLUDED_NIGHTS); test pending: plan phase 3 (per-night flag row), as in AGENTS.md'
