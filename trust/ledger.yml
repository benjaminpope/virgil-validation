- id: F29
  title: fit_staged_nuisances passes Stage 2's already-minimized calibration nuisances instead of nominal calibration (g = 1) as start= to Stage 3's kkt_report, inflating nuisance grad_rel >> NUISANCE_TOL and forcing StagedFit.kkt['converged'] = False at a stationary joint solution
  objects: [virgil.radio.fit_staged_nuisances, virgil.radio.StagedFit]
  ruling: virgil
  referee: mathematics (Stage 3 image KKT converges with pg_rel < KKT_TOL, zero_violation = 0, and kkt_w < KKT_W_TOL, and raw nuisance grad_norm ~ 5.6e-4 has grad_rel ~ 7.6e-4 < NUISANCE_TOL = 1e-3 relative to nominal g = 1, whereas dividing by Stage 2's post-optimization gradient inflates grad_rel to 1.10 >> NUISANCE_TOL)
  kind: bug (Stage 3 kkt_report normalizes nuisance gradients against Stage 2 optimum instead of nominal calibration)
  evidence:
    - tests/test_042_lcurve_ensemble_radio.py::test_radio_fit_staged_nuisances_recovers_gains_ref_obs_and_box_edge_guard
    - tests/test_042_lcurve_ensemble_radio.py::test_f29_fit_staged_nuisances_stage3_kkt_converged_at_joint_optimum
  status: open

- id: F30
  title: kkt_report constructs _Objective(..., boxed=True) on LogUniform parameters fitted in flat ln F, adding +1/F so stationary fit() optima retain grad_norm ~ 1/F and fail NUISANCE_TOL from nearby starts
  objects: [virgil.fitting.kkt_report]
  ruling: virgil
  referee: mathematics (interior gtol=1e-13 fit() optimum on LogUniform(1e-2, 1.0) satisfies |d(-ln L)/dF| ~ 1.1e-4 in fitted flat ln F, matching Uniform(1e-2, 1.0) where grad_norm = 1.1e-4 and grad_rel = 9.4e-8 < NUISANCE_TOL; kkt_report sets boxed=True, adding -d(ln p)/dF = +1/F = 4.63 so grad_rel = 3.87e-3 > NUISANCE_TOL = 1e-3 and converged = False from a 5% nearby start)
  kind: bug (kkt_report sets boxed=True on flat-coordinate LogUniform parameters, adding +1/F to nuisance gradients at stationary fit() optima)
  evidence:
    - tests/test_042_scenes_starlet_kkt.py::test_kkt_report_softmax_image_multiplier_and_nuisance_start_gate
    - tests/test_042_scenes_starlet_kkt.py::test_f30_kkt_report_loguniform_nuisance_stationary_from_nearby_start
  status: open

- id: F31
  title: kkt_report scales LinearImage('sqrt') dark-pixel want_grow deadband by sqrt(f_peak / f_i) > 1000 contrary to its docstring, suppressing >3.8e4x negative flux gradients and certifying converged = True
  objects: [virgil.fitting.kkt_report]
  ruling: virgil
  referee: mathematics (kkt_report docstring states LinearImage 'sqrt' uses the same want_grow rule as 'softmax' with g = dJ/dflux and mu = 0, i.e. g_i < -3 * scale * max(kkt_rel, KKT_TOL); _want_grow multiplies that threshold on 0 < f_i < 1e-6 * f_peak by sqrt(f_peak / f_i) >= 1000, so at x_i = 1e-6 * x_peak a starved companion pixel with -g_i = 1012.5 > 3.85e4 * (3 * scale * KKT_TOL) reports want_grow = 0.0 and converged = True instead of 1/64)
  kind: bug (LinearImage('sqrt') _want_grow multiplies dark-pixel deadband by sqrt(f_peak / f_i) > 1000 contrary to docstring, suppressing starved dark pixels)
  evidence:
    - tests/test_042_scenes_starlet_kkt.py::test_kkt_report_sqrt_linear_image_stationarity_and_exact_zero_pixel
    - tests/test_042_scenes_starlet_kkt.py::test_f31_kkt_report_sqrt_dark_pixel_want_grow_unscaled_deadband
  status: open

