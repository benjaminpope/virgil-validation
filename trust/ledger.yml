  note: identified by Gemini 4 Carbon adversarial review (session ddbaaa6e) and reproduced numerically on virgil d79696de9d97 by worker batch2-disks; fixed in virgil 5ca955ad6ceb (merged in virgil#673) and verified at virgil 0.4.2 c2be8278a4 where the strict xfail is removed and the test passes to 2.4e-6 (n_r = 9 vs 17 refinement drift 1e-15).

