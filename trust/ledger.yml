- id: F22
  title: closure-phase residuals are undefined where a model visibility crosses zero (phase formulation vs complex bispectrum); whitened_residuals' 0.4.2 docstring drops the "continuous and smooth everywhere" claim
  objects: [virgil.likelihood.whitened_residuals]
  ruling: definition
  kind: 'formulation choice (a model visibility V passing through 0 changes its phase by pi, so any closure-phase residual built from arg V is singular at |V| = 0 with d(phase)/dx ~ 1/|V|, whereas a complex-bispectrum loss is polynomial in V; flat-start MEM fits that drift onto a visibility null can stall there, tracked as an enhancement in virgil#309. virgil 0.4.2 removed the "continuous and smooth everywhere" claim from whitened_residuals'' docstring)'
  referee: mathematics (the phase of a complex number is discontinuous at 0; documented alongside eht-imaging in docs/method/ehtim.md)
  evidence: [tests/test_ehtim_reconstruction.py::test_objective_matches_ehtim]
  status: documented
  links: [https://github.com/benjaminpope/virgil/issues/309]
  decision: 'ruled definition / documented (Ben, 2026-11-15): closure-phase smoothness across |V| = 0 does not need to hold for the phase-residual likelihood (and whitened_residuals'' docstring no longer claims it in 0.4.2), and visibility-null stalling does not need to be a trust-graph blocker; bispectrum support remains tracked in virgil#309.'
  note: originally recorded on review/integration as F20; tests/test_mem_null_discontinuity.py is intentionally not added as a trust node per Ben's 2026-11-15 ruling.


- id: F23
  title: gauss_newton_diag's docstring and the radio innovation register give the entropy-pixel diagonal as weight * b; virgil returns weight * b * (1 - b)
  objects: [virgil.fitting.gauss_newton_diag]
  ruling: virgil
  kind: 'documentation (through the unit-sum softmax the Skilling-Bryan metric weight * sum db^2/b has diagonal weight * b * (1 - b), which virgil returns to 1e-15; weight * b is its b << 1 limit, 1e-6 off on a million-pixel image and up to 20% on the 6 x 6 test. Nothing is wrong numerically, so there is no strict xfail: the test pins the exact form and fails if the diagonal ever becomes weight * b)'
  referee: mathematics (the metric pulled back through the softmax, dense Jacobian)
