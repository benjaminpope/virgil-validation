- id: P14
  title: oimodeler's oimFastRotator parametrizes gravity darkening with rot^0.4 and K = sin(1/3) pi instead of O(omega^2) Roche scaling
  objects: [oimodeler]
  ruling: external:oimodeler
  kind: 'bug (oimodeler 0.8.1, oimCustomComponents.fastRotator: setting a = (2/3) rot^0.4 and K = sin(1/3) pi gives an O(omega^0.4) slow-rotation equator-on V^2 anisotropy across rot = 0.01..0.04 instead of the physical O(omega^2) Roche/ELR11 centrifugal scaling, over-predicting slow-rotator anisotropy by >100x at rot = 0.01)'
  referee: mathematics (Roche/von Zeipel/ELR11 O(omega^2) centrifugal scaling of equator-on V^2 anisotropy)
  evidence: [tests/test_rotator_convention.py::test_p14_oimodeler_fast_rotator_gravity_darkening_scaling]
