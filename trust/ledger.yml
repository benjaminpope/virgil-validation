  objects: [virgil.models.FlaredDiskGaussian, virgil.models.FlaredDiskHG, virgil.models.FlaredDiskPowerLaw]
  ruling: definition
  kind: 'convention (in Blakely et al. 2025 eqs. 2-9, tilting an inclined flared scattering surface z(rho) = h_0 (rho / r_0)^beta with major-axis line of nodes at pa East of North places the near rim at pa + 90 deg; flipping pa -> pa + 180 deg moves the near rim to pa - 90 deg and reverses every first-lobe closure phase. Which half-plane corresponds to inc in (0, 90) deg at a given pa is an on-sky orientation: the near-side rim direction, the photocentre direction and the closure-phase sign all follow from it. Our own 3D surface Fourier sum pins virgil to it at < 1e-10 deg and wrong-sign controls reject the opposite choice, but both are our own transcription of the documented formula)'
  referee: mathematics (3D flared scattering surface Fourier sum and first-lobe closure-phase sign, crosscheck.disks); this is our own transcription, so it cannot confirm the convention
  evidence:
    - tests/test_flared_disk_nearside.py::test_flared_disk_gaussian_nearside_geometry
    - tests/test_flared_disk_nearside.py::test_flared_disk_hg_nearside_geometry
    - tests/test_flared_disk_nearside.py::test_flared_disk_powerlaw_nearside_geometry
    - tests/test_flared_disk_nearside.py::test_flared_disk_farside_controls_flip_quadrant_and_closure_phase_sign
  status: open
  decision: 'not ruled by Ben as a definition. On 2026-11-16 (gate G1a) Ben confirmed it stays a `convention:` on the FlaredDisk nodes in trust/graph.yml, because an on-sky orientation needs a check written by other people (code or a published result that fixes which side is near for a given pa and inc). Until one exists the nodes show "convention from virgil''s docs". ruling: definition records only that virgil''s sign is a choice, not a bug; status: open means no outside check yet. The wrong-sign control tests stay as regression guards.'

- id: D25
  title: 'PositionData: astrometric calibration sign and scale (theta_meas = theta_sky + north_angle, rho_meas = plate_scale * rho_sky) is an internal parameter-sign convention checked via properties: {calibration: 1} and wrong-sign controls'
  objects: [virgil.orbits.PositionData]
  ruling: definition
  kind: 'convention (PositionData.model follows Octofitter''s nuisance parameterization Thompson et al. 2023, AJ 166, 164, adding north_angle to the sky position angle and multiplying separation by plate_scale; defining north_angle with the opposite sign or plate_scale as its reciprocal is an equivalent reparameterization that our wrong-sign controls reject by > 50 sigma, while PositionData''s astrometric log-likelihood is independently confirmed against SciPy and PMOIRED''s profiled OIFITS delta_chi2)'
  referee: mathematics (crosscheck.orbits multi-epoch calibration recovery and wrong-sign controls)
  evidence:
    - tests/test_position_calibration.py::test_position_data_calibration_model_and_recovery
    - tests/test_position_calibration.py::test_position_data_wrong_calibration_sign_and_scale_fail_by_over_50_sigma
  status: documented
  decision: 'definition, confirmed by Ben Pope 2026-11-16 (gate G1b); north_angle sign signed 2026-10-06. The calibration nuisance sign is an internal parameterisation, pinned via properties: {calibration: 1} and wrong-sign controls, alongside external PMOIRED confirmation of PositionData.loglike.'

- id: F26
  title: 'ClosureOffsets(scale_penalty=True) scales periodic wrap-penalty rows by unprojected hypot(sigma, sigma_off) from diag(M M^T), so a 4-telescope left-null mode (n^T T = 0) alters model_loglike when Delta != 0'
  objects: [virgil.gains.ClosureOffsets, virgil.gains.closure_offsets]
  ruling: virgil
  kind: 'bug (on a 4-telescope frame, the 1D left-null vector n with n^T T = 0 vanishes identically for every physical realization of baseline or closure phases. In virgil 0.4.2, ClosureOffsets defaults to scale_penalty=True and divides each closure phase''s periodic chord-minus-sine correction 2 sin^2(Delta / 2) by hypot(sigma_i, sigma_off,i) with sigma_off,i^2 = (M M^T)_ii computed per triangle before projecting M onto the rank-3 column space of T, so a pure left-null mode with 0.3 rad amplitude shifts model_loglike by +0.025 nats on our 4-UT test scene whenever model_cp != data_cp, whereas scale_penalty=False projects onto col(T) and leaves model_loglike invariant to < 1e-12)'
  referee: mathematics (closure-of-closures null-space invariance n^T T = 0 and exact dense-Gaussian marginal + periodic wrap decomposition, tests/test_gains_algebra.py)
  evidence:
    - tests/test_gains_algebra.py::test_f26_closure_offsets_scale_penalty_projects_onto_span_of_T
    - tests/test_gains_algebra.py::test_offsets_outside_the_span_of_T_do_not_enter_unscaled_and_pin_scaled
  status: open

