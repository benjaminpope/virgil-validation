- id: D18
  title: 'Halbwachs+2020 published ellipses are adopted as 1 sigma as rescaled; the unrescaled variant divides by 0.1626 * 1.0856 = 0.17652 (crosscheck.astrometry.published_position)'
  objects: [virgil.epochs.rank_orbits]
  ruling: definition
  kind: 'convention. The factor is the rescaling that Halbwachs+2020 (2020MNRAS.496.1355H) apply to their formal errors, as transcribed from the paper by an earlier worker; this worker did not re-read it, so the value is unconfirmed against the paper. The adopted covariance (cov) is the published rescaled ellipse; the divided one (cov_alt) is reported beside it and never used for a verdict'
  referee: standards (Halbwachs et al. 2020, 2020MNRAS.496.1355H)
  evidence: [tests/test_trackb_astrometry.py::test_published_conventions]
  status: documented

- id: D19
  title: 'Waisberg+2025 give no covariance; isotropic per-axis scatter 40 uas (zeta Boo) and 20 uas (eta Oph) is assumed (crosscheck.astrometry.WAISBERG_SIGMA); Rowan+2026 errors are multiplied by their published s_ast = e^0.8'
  objects: [virgil.epochs.rank_orbits]
  ruling: definition
  kind: 'convention. WAISBERG_SIGMA is the epoch scatter read from Waisberg+2025 (2025OJAp....8E..63W) by an earlier worker, per system and isotropic; not re-read from the paper by this worker, so unconfirmed. The Rowan+2026 (2026PASP..138b4203R) factor e^0.8 = 2.23 is the paper''s own published s_ast scaling of its bootstrap errors: it INFLATES the adopted errors (the unscaled ones are kept as cov_alt), so a claim that it deflates the d2 statistic is backwards (Argon''s V8 in vv#207, corrected in the 0.4.2 consolidated work packages). Inflating errors makes a pull comparison easier to pass, which is why the factor is the paper''s and not ours'
  referee: standards (Waisberg et al. 2025; Rowan et al. 2026)
  evidence: [tests/test_trackb_astrometry.py::test_published_conventions]
  status: documented

