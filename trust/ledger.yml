- id: D5
  title: CANDID's and fouriever's closure-phase residual is the plain phase difference; virgil's is the chord 2 sin(delta/2) (independent closure phases), or sin(delta) plus a periodic penalty (correlated ones, since virgil#174)
  objects: [virgil.likelihood.whitened_residuals, external_bridge.candid_bridge]
  ruling: definition
  referee: mathematics (both chi-squareds computed independently); equal on V2-only files to 1e-7
  evidence:
    - tests/test_candid.py::test_closure_phase_residual_definitions
    - tests/test_candid.py::test_chi2_matches_candid_on_v2
    - tests/test_fouriever.py::test_correlated_chi2_matches_fouriever
  status: documented

- id: D6
  title: With unequal closure-phase errors in a group, fouriever uses r^T C^+ r and virgil r^T D^-1/2 R^+ D^-1/2 r (different generalised inverses of the singular C)
  objects: [virgil.oidata.OIData.cp_noise, virgil.likelihood.whitened_residuals]
  ruling: definition
  referee: mathematics (each form written independently, 1e-12); statistics (on closures of baseline-phase noise virgil's form is closer to the nominal chi-squared, e.g. 2.94 vs 2.75 against 3)
  evidence:
    - tests/test_fouriever.py::test_unequal_errors_use_different_generalised_inverses
    - tests/test_fouriever.py::test_whitened_form_is_better_calibrated_on_baseline_noise
  status: documented

- id: D7
  title: For correlated closure phases fouriever counts every closure phase as a degree of freedom in the Absil and injection significance; virgil counts the independent ones (OIData.n_independent)
  objects: [virgil.limits.absil_limits, virgil.limits.injection_limits, virgil.limits.nsigma]
  ruling: definition
  referee: statistics (with a covariance of rank r the chi-squared has r degrees of freedom, 3 of the 4 closure phases of four telescopes per snapshot and channel, as tests/test_fouriever.py::test_whitened_form_is_better_calibrated_on_baseline_noise measures)
  evidence: [tests/test_fouriever_limits.py::test_limits_match_fouriever_exactly]
  status: documented

- id: D8
  title: CANDID's and fouriever's injection limits refit the primary's uniform-disk diameter to the injected data; virgil's hold every parameter but the flux
  objects: [virgil.limits.injection_limits]
  ruling: definition
  referee: mathematics (with the diameter held, virgil equals CANDID's criterion solved exactly to 6e-6; refitting can only lower chi2_UD, so the limit rises, by 20-34 % here)
  evidence: [tests/test_candid.py::test_injection_limits_match_candids_criterion]
  status: documented

