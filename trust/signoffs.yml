# Conventions confirmed outside virgil (trust/graph.yml, "convention").
#
# A convention taken from virgil's own documentation is only partly checked:
# our code was written from the same documentation, so agreement shows the
# two codes match, not that the convention is the one astronomers use. An
# entry here confirms one convention of one part, by either
#   citation: a paper, equation and page that defines it, or
#   by, date, commit: Ben's sign-off after reading the code at that virgil commit.
#
# node:
#   property:
#     citation: "Author et al. (year), eq. N, p. M"
#     -- or --
#     by: Benjamin Pope
#     date: YYYY-MM-DD
#     commit: <full virgil commit hash>
#     note: what was checked
virgil.orbits.PositionData:
  calibration:
    by: Benjamin Pope
    date: 2026-10-06
    commit: 96631b925f53287cf818fa0a2d065136aa97fdf9
    note: >-
      north_angle is the error added to every measured position angle (a
      companion at true PA theta is measured at theta + north_angle), as in
      OIData.with_north_angle; checked by
      tests/test_orbits_more.py::test_north_angle_adds_to_the_measured_position_angle.
      Approved by Ben in the validation session.
virgil.models.BinaryModelCartesian:
  position_angle_origin:
    status: pending
    signed: false
    mutants:
    - M11
    note: 'UNSIGNED, for Ben. A mutant of the convention `position_angle_origin` survived, so no test
      failed if virgil took the other reading: Position angle measured as N of E (arctan2(ddec, dra))
      instead of E of N. Confirm the convention against a paper or by reading the code, then replace this
      entry by `by`, `date` (YYYY-MM-DD) and `commit` (full hash), or `citation`, and declare the property
      a `convention` of the node in trust/graph.yml. Killing the mutant with a test written from the same
      documentation does not confirm the convention.'
    mutants_now:
      M11: killed
