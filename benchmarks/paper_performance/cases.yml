# Protocol-wide predeclared settings for the paper-performance benchmarks (WP-0).
# Per-comparison cases, data and tasks live in binary/cases.yml, orbit/cases.yml and imaging/cases.yml (one owner each).
# Changing anything here after a measured run starts needs a line in CHANGES.md giving the reason; never because of a timing.

protocol:
  source: reports/benchmarks-plan.md (kept with the paper repository; sections 1-3 are restated in README.md)
  units: seconds, megabytes (decimal), float64, CPU only
  repeats:            # processes x warm repeats, by length of one call
    default: [3, 5]
    call_over_60s: [3, 3]
    call_over_600s: [1, 1]   # flag single_run
  timeout_per_call_s: 1800
  matrix_budget_h: 7
  threads:
    primary: 1
    second_pass: 2           # every native row and binary T3; never more than 2
  thread_check:              # (user+sys)/wall
    one_thread_max: 1.2
    two_thread_max: 2.3
  noisy_calibration_factor: 1.3   # t_calib above this multiple of the session median per language
  pyslot_mem_per_measured_process: 6G
  statuses: [ok, timeout, oom, error, gate_failed, not_run, unsupported]
  configs: [matched, tight, native, matched-coarse, matched-truthstart]

environment:
  python_env: ~/.cache/virgil-bench/venv          # built by env/setup_bench.sh; activate with `source ~/.cache/virgil-bench/activate.sh` (see README)
  virgil_ref_source: .github/workflows/tests.yml (VIRGIL_REF on origin/main); recorded in every row
  pmoired: 26.10.1
  ehtim: 1.3.2 in ~/code/virgil-validation/.venv-ehtim (EHTIM_PYTHON)
  julia: 1.12 through juliaup (orbit comparison only; built by orbit/setup_julia.sh)
  disk_floor_gb: {install_python: 6, install_julia: 9, after_julia_install: 5, hard_floor_after_gc: 4}

comparisons:
  binary:  {file: binary/cases.yml,  other_code: PMOIRED 26.10.1}
  orbit:   {file: orbit/cases.yml,   other_code: Octofitter.jl 9.0.0}
  imaging: {file: imaging/cases.yml, other_code: eht-imaging 1.3.2}

priority_order:   # run_all.sh cuts from the bottom when the 7 h budget runs out
  - gates
  - [binary T2 all cases, orbit O-A-sim matched, imaging I-sim-24 and I-sim-48 ladder]
  - [binary T1, binary T3 at 1 thread, orbit O-A-real, imaging I-sim-96, imaging I-sim-ring native]
  - [orbit O-B-sim, pulls (binary then orbit)]
  - [the 2-thread pass]
  - [imaging I-sim-large, remaining tight rows, matched-coarse, matched-truthstart]

limits_to_state_in_every_output:
  - one laptop CPU (Apple silicon), no GPU row
  - 1 thread primary, 2 threads at most; nothing ran on all cores
  - eht-imaging without NFFT (direct transform in both codes)
  - Octofitter interferometry on simulated point-source data only
  - O-A-real (HD 224974) is period-informed
  - PMOIRED and Octofitter parallel modes not run beyond 2 workers
  - versions and commits as recorded in each row
