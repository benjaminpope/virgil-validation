# ===== mkdocs.yml =====
# Configuration file for the virgil-validation documentation, built with
# Zensical (`zensical build --clean --strict`), laid out like virgil's.
# The home page (docs/index.md) is the Trust page, generated by
# scripts/trust.py; each part on it links to the page below that explains
# how it was checked.

# ===== Setup and Themes =====
markdown_extensions:
  - tables
  - toc: {permalink: true}
  - pymdownx.tasklist: {custom_checkbox: true}
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.arithmatex:
      generic: true

extra_css:
  - stylesheets/nav.css
  - assets/trust.css

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
  - assets/trust.js

site_name: virgil-validation
site_description: Independent validation of virgil against first principles, dLux and other packages
site_url: https://benjaminpope.github.io/virgil-validation/
repo_url: https://github.com/benjaminpope/virgil-validation
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    scheme: slate
  icon:
    logo: material/check-decagram
  features:
    - navigation.sections
    - content.code.copy

# ===== Plugins =====
plugins:
  - search

# ===== Navigation =====
nav:
  - Trust: index.md
  - Data:
      - "Long-baseline interferometry": data/long_baseline.md
      - "Visibility-only data": data/visibility_only.md
      - "Aperture masking": data/masking.md
      - "OIFITS writing and observables": data/oifits_observables.md
  - Models:
      - "Geometric visibilities": models/visibilities.md
      - "Limb-darkened disks": models/limb_darkening.md
      - "Rapid rotators": models/rapid_rotators.md
      - "Flared disks and harmonix": models/flared_disks.md
      - "Spectra": models/spectra.md
      - "Cones, fields and invariants": models/cones_fields.md
  - Likelihood:
      - "Correlated closure phases": likelihood/closure_phases.md
      - "Linear marginalization": likelihood/linear_marginals.md
      - "Priors and angles": likelihood/priors.md
      - "Flux spectra and differential phases": likelihood/spectra_phases.md
  - Inference:
      - "Grid search and detection limits": inference/grid_limits.md
      - "Detection statistics": inference/detection.md
      - "Sampling": inference/sampling.md
      - "Small helpers": inference/helpers.md
  - Orbits:
      - "Kepler orbits": orbits/kepler.md
      - "Against orbitize!": orbits/orbitize.md
  - Imaging:
      - "Transforms, beams and regularizers": imaging/machinery.md
      - "Against eht-imaging": imaging/ehtim.md
      - "Image metrics and ensembles": imaging/metrics_ensembles.md
  - Method:
      - "How trust is built": method/index.md
      - "Findings": method/findings.md
      - "Not yet covered": method/coverage.md
      - External packages:
          - PMOIRED: method/pmoired.md
          - CANDID: method/candid.md
          - fouriever: method/fouriever.md
          - orbitize!: method/orbitize.md
          - eht-imaging: method/ehtim.md
      - "Evidence table": evidence.md
      - "Generated results": results.md
