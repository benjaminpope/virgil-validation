[project]
name = "virgil-validation"
version = "0.1.0"
description = "Independent validation of virgil against first-principles and dLux simulations"
requires-python = ">=3.11"
dependencies = ["numpy", "scipy", "astropy", "dLux>=0.15", "matplotlib", "virgil-astro", "pytest"]

[project.optional-dependencies]
# Other people's packages, pinned: updating a pin is a deliberate PR.
external = ["pmoired==26.10.1"]
docs = ["mkdocs<2", "mkdocs-material"]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
