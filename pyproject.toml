[project]
name = "virgil-validation"
version = "0.1.0"
description = "Independent validation of virgil against first-principles and dLux simulations"
requires-python = ">=3.11"
dependencies = ["numpy", "scipy", "astropy", "dLux>=0.15", "matplotlib", "virgil-astro", "pytest", "pyyaml", "mpmath"]

[project.optional-dependencies]
# Other people's packages, pinned: updating a pin is a deliberate PR.
external = ["pmoired==26.10.1"]
docs = ["mkdocs<2", "mkdocs-material"]

# The evidence plugin loads whenever the package is installed, so its options
# (--evidence, --require-validates) parse whatever the order of arguments.
[project.entry-points.pytest11]
evidence = "evidence.plugin"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --require-validates"
markers = [
    "x64: run virgil in float64 (the default in tests/conftest.py)",
    "float32: run virgil in float32",
    "slow: long simulation (weekly job only)",
    "external: needs another package (PMOIRED; CANDID via scripts/setup_candid.sh; fouriever to come)",
]
