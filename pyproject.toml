[project]
name = "virgil-validation"
version = "0.1.0"
description = "Independent validation of virgil against first-principles and dLux simulations"
requires-python = ">=3.11"
dependencies = ["numpy", "scipy", "astropy", "dLux>=0.15", "matplotlib", "virgil-astro", "pytest", "pyyaml", "mpmath"]

[project.optional-dependencies]
# Other people's packages, pinned: updating a pin is a deliberate PR.
external = ["pmoired==26.10.1"]
# Stage V of the PolarDisk plan (benchmarks/polar_disk): radial-profile codes, pinned.
polar-disk = ["frank==1.2.3", "vis-r @ git+https://github.com/drgmk/vis-r@f53467077b04878986c967b501d88c54ff3efb86", "astro-frap==1.0.2", "oimodeler==0.8.1"]
# Stage A of the alias bands (virgil#319) until it is released; plots need corner.
orbit-aliases = ["virgil-astro @ git+https://github.com/benjaminpope/virgil@9061a1d0044c990fad941aae03e051cc582ff9e8", "corner"]
docs = ["mkdocs<2", "mkdocs-material", "zensical>=0.0.62,<0.1"]  # built with Zensical, as virgil is

# The evidence plugin loads whenever the package is installed, so its options
# (--evidence, --require-validates) parse whatever the order of arguments.
[project.entry-points.pytest11]
evidence = "evidence.plugin"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --require-validates"
markers = [
    "x64: run virgil in float64 (the default in tests/conftest.py)",
    "float32: run virgil in float32",
    "slow: long simulation (weekly job only)",
    "campaign: hours-long campaign (OzSTAR); skipped unless VALIDATION_CAMPAIGNS=1",
    "external: needs another package (PMOIRED; CANDID via scripts/setup_candid.sh; eht-imaging, MPoL, fouriever, orbitize! via setup_external.sh)",
]
