      instrument: VLT/NACO aperture masking (9 Sgr 7 holes Ks; delta Vel 18 holes NB 1.64 and IB 2.12; HD 136164 L')
      source: AMICAL OIFITS on OzSTAR, ~/data/eso_binaries/naco/ (not in the OiDB; not on this machine)
      epochs: "9 Sgr 2011-03-10; delta Vel 2009-01-07; HD 136164 Ab 2012-08-01"
      window: all channels; V2 and closure phases
      model:
        externals: "M1"
        literature: "orbit prediction"
      literature: 9 Sgr 11.89 +/- 0.3 mas, PA 72.3 +/- 1.5 deg (Fabry et al. 2021); delta Vel
