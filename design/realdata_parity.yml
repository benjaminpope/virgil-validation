# Registered design: real-data parity and a real-data null test.
# Registered on 2026-10-12, before any run. Rationale and conventions: design/realdata_parity.md.
# Its SHA-256 is in design/realdata_parity.sha256 (checked by tests/test_realdata_design.py);
# a result records that hash, and a change after the first run is a new version (a new file),
# never an edit.
#
# Why: only 4 evidence records use the `literature` root (the imaging-contest binaries), the
# ESO verdicts are provisional, real GRAVITY fits show chi2/N of 3 to 606 absorbed by a free
# phi_scale, and our simulated noise is the likelihood's own model, so pulls are near
# tautological. Part A fits identical real files with virgil and with other people's codes.
# Part B asks how often virgil's detection pipeline fires on real files that hold no
# companion. Part C only lists what the simulator cannot yet do.

version: 1
status: registered
virgil: record the commit and package versions in each result (evidence header)
pins:                        # an external is run only at these versions
  pmoired: "26.10.1"
  candid: "c255e90 (1.1.0)"
  fouriever: "0.4.3"
nothing_is_tuned_after_a_run: >
  Targets, epochs, windows, models, tolerances and counts below are fixed. A fit that fails,
  or a file that cannot be read, is listed with its reason and counts as a failure of the
  code that failed; it is never dropped silently. Changing any value starts version 2.

# --------------------------------------------------------------------------------------------
# Part A: same-file parity
# --------------------------------------------------------------------------------------------
parity:
  frozen_input:
    rule: >
      One deterministic script cuts each epoch's "parity file" from the archived OIFITS: the
      target, the INSNAME, the spectral window and the unmatched-closure-triangle rule of
      scripts/oidb_fit.load, all applied once, written as OIFITS, hashed (SHA-256 recorded).
      Every code then reads that one file with its own reader. A code may not select or
      flag data itself.
    unit: one epoch = one night's files of the target, joined (a single file where the
      collection has one per night)
    nothing_else: no calibration, no error inflation, no outlier clipping by any code
  observables:
    GRAVITY: [T3PHI]                   # closure phases only, as scripts/oidb_fit and Track B
    other: [V2, T3PHI]                 # PIONIER, MIRC/MIRC-X, AMBER, SAM: V2 and closure phase
    not_used: [T3AMP, differential phase, flux, any extra observable]
    reported_variant: GRAVITY with V2 (transfer function not removed); reported, not scored
  smearing: >
    off in every code (CANDID: dwavel = 0; PMOIRED: no wl kernel; virgil: none)
  smearing_variant: >
    epochs with s*B/(lambda R) > 0.1 are also fitted with virgil's Smeared and CANDID's own
    smearing; reported only (a definition difference, docs/method/candid.md)
  models:
    M1_common:
      what: UD primary (diameter free, LogUniform(0.01, 20) mas) + point companion at
        (dra, ddec), flux ratio free
      used_by: [virgil, PMOIRED, CANDID]     # CANDID's only binary model
      note: CANDID has no companion diameter; this is its model
    M2_published:
      what: the model of the reference paper (fixed UD sizes, point stars, etc.), as the
        scripts/oidb_fit recipe for that collection
      used_by: [virgil, PMOIRED]
    M3_ud:
      what: a single uniform disk, diameter free; V2 only
      used_by: [virgil, PMOIRED, "CANDID (chi2 task scanned and minimised)"]
    scoring: >
      M1 is the only model scored for CANDID; M2 (or M3 for a single star) is the only
      model scored against the literature. PMOIRED is scored on both.
  arms:
    V0:
      what: virgil with the file's quoted errors, no error scales, closure-phase
        correlations OFF (data.cp_noise = None), i.e. the same independent-residual
        likelihood PMOIRED and CANDID use
      compared_with: PMOIRED with its normalisation undone (sigma / sqrt(chi2_red), as
        external_bridge.pmoired_models.fit does); CANDID with its sqrt(chi2_r) scaling undone
      role: scored
    V0c:
      what: V0 with virgil's default closure-phase correlations (whitened group), for 4 or
        more telescopes
      compared_with: fouriever (pseudo-inverse of the correlated covariance); PMOIRED/CANDID
        independent-residual fits for the best fit only
      role: reported; error bars of 4T+ files are expected 4-6 percent apart from PMOIRED's
        (docs/method/pmoired.md)
    V1:
      what: >
        virgil as a user runs it on real data: free vis_scale and phi_scale (the fit that
        absorbed chi2/N of 3 to 606), Laplace covariance with the fitted scales
      compared_with: PMOIRED and CANDID as shipped (their sqrt(chi2_red) normalisation)
      role: reported, with one scored limit (A5)
  externals:
    PMOIRED: external_bridge.pmoired_models.fit (OI.doFit, auto=False, obs V2/T3PHI); every
      error floor and minimum relative error set to zero; Nr irrelevant (no rings)
    CANDID: external_bridge candid_worker `fitmap` (starts on a grid, uncertainties scaled by
      sqrt(chi2_r); both returned). A UD-only scan is a new task (gap, below)
    fouriever: external_bridge fouriever_worker `chi2` / `chi2_grid` evaluated at each code's
      best-fit point (correlated closure phases, point binary). A `fit` task is a gap, below
    gaps_to_build: [candid ud_fit (minimise chi2 over diam* with f = 0), fouriever fit task,
      a pmoired chi2-at-given-parameters helper (doFit with every parameter fixed)]
  convention_map:               # each row is pinned by docs/*_conventions.md and tests/test_*
    position: virgil dra East, ddec North = PMOIRED x, y = CANDID x, y (mas)
    flux: virgil flux = companion/primary = PMOIRED f2 with f1 = 1 = CANDID f / 100
    primary_ud: >
      virgil UniformDisk(diam) = PMOIRED {ud: diam} = CANDID diam*
    closure_phase_sign: T3 = V12 V23 V*13 in all
    fourier_sign: exp(-2 pi i (u dra + v ddec)/lambda) in all
    cp_residual: virgil chord 2 sin(d/2), PMOIRED and fouriever plain d, CANDID wrapped plain d
      (ledger D5; 1e-6 relative near a good fit, up to 1e-3 far from one)
    chi2_normalisation: compare total chi2 and N, never reduced chi2 (PMOIRED's is chi2/(N-n_free),
      CANDID's chi2/(N-n_fit+1), virgil's chi2/N independent observables)
    n_data: each code's count of V2 and closure-phase samples must be equal; if not, the
      difference is listed and that epoch is reported only
  epochs_per_rule: "first, last, and every epoch between listed here"
  tolerances:                   # all registered; sigma is the EXTERNAL code's reported error on
                                # the matched convention (arm V0)
    A1_best_fit:
      statistic: z = |theta_virgil - theta_X| / sigma_X, per parameter (dra, ddec, flux, and
        diam in M1/M3), per epoch, per external X in {PMOIRED, CANDID}
      per_comparison: 0.25
      pass_fraction: 0.90        # at least 90 percent of comparisons within 0.25 sigma
      hard_limit: 1.0            # no comparison above 1 sigma unless it is explained by A1m
    A1m_mode_rule: >
      For a comparison above 1 sigma, virgil is restarted from X's best fit and X's loss
      is evaluated at virgil's best fit (the convention-refit procedure of the OiDB plan).
      If the codes land in the same point within 0.25 sigma it was a search miss
      (counted against whichever code started in the worse basin: virgil's grid search
      counts against virgil). If both are distinct local minima, the deeper total chi2
      (common definition, evaluated by both codes) wins; a virgil minimum that is deeper
      is not a failure, a shallower one is.
    A2_chi2:
      at_same_parameters: >
        |chi2_virgil - chi2_X| / chi2_X <= 1e-3 (5e-3 if chi2/N > 10) at the
        parameters of virgil's best fit, evaluated by virgil, PMOIRED, CANDID and fouriever;
        all epochs; one failure is a failure
      at_own_best_fit: >
        |chi2_virgil - chi2_X| / chi2_X <= 0.01, every epoch
      n_data_equal: exact
    A3_error_bars:
      statistic: R = sigma_virgil(V0) / sigma_X, per parameter, matched convention
      band: [0.90, 1.10]
      pass_fraction: 0.90
      hard_band: [0.75, 1.33]    # none outside
      scope: 3-telescope files and V0; 4T+ files (V0c vs fouriever, or V0 vs PMOIRED) use
        [0.85, 1.15], pass fraction 0.90, hard band [0.70, 1.43]
    A4_literature:
      rules: >
        Reuse scripts/oidb_compare.CRITERIA unchanged (epoch 0.25, parametric 2.0, adopted 1.0
        sigma, chi2_flag 3.0, scale_flag 3.0; its CRITERIA_HASH is printed with its table).
        Published values are those of oidb/references/<id>.json; a quantity with no published
        value yet (reference record pending, OB0) is reported only.
      orbit_predictions: >
        NACO SAM rows compare with the published orbit's prediction at the epoch, the
        orbit's position error carried (crosscheck.orbits); pass: |delta| / sqrt(sigma_v^2 +
        sigma_pred^2) <= 3 per coordinate (position projected on the error ellipses); the
        predictions are not same-data, so this is reported and never part of the verdict
      pass_fraction: 0.90        # of scored literature rows
    A5_scales_limit: >
      Arm V1: the fitted phi_scale and vis_scale and the raw chi2/N are recorded for every
      epoch. An epoch with a fitted scale > 3 (scale_flag) is listed as "model or errors have
      failed" and not counted as a positive parity result in A1-A3 for V1 (scored for V0 as
      usual). Scored limit: V1 sigma / V0 sigma must lie within 25 percent of the larger of
      the two fitted scales (the Laplace covariance scales with them): [0.75 s, 1.25 s].
  verdict:
    PASS: A1, A2 and A3 hold for PMOIRED and for CANDID on the scored epochs, A5 holds, and
      fouriever's chi2 at the same parameters agrees (A2) on every epoch where it applies
    FAIL: any scored criterion fails; each failing comparison is a finding (ledger entry
      with the next free ID, a passing test pinned to documented behaviour, a strict xfail
      stating what is wrong) unless the ruling is "definition"
    INCONCLUSIVE: fewer than 80 percent of the planned fits complete for an external code
      (the reasons are listed); the criteria are then reported, not judged
    ruling_before_blaming_virgil: >
      A disagreement is first checked for the convention differences above and for the
      external code's own known problems (docs/method/pmoired.md P1-P3, candid.md P4); a
      disagreement ruled external or definition is recorded as such
  # Targets, spanning GRAVITY, PIONIER, MIRC/MIRC-X, AMBER and NACO SAM. 12 targets, 36
  # planned fits. sizes are from oidb/manifest.yml (metadata; nothing is downloaded here).
  targets:
    - id: gl229
      name: Gl 229 Ba-Bb
      instrument: GRAVITY (SC, single field)
      source: {oidb: 782185b2-0727-42b0-a185-b2072732b047, level: L3, mb: 10.3}
      epochs: "5 nights (2023-12-26, 2023-12-30, 2024-02-28, 2024-03-29, 2024-04-29); the first
        file of each night, not the night's files joined: the pair moves 0.15 mas per hour
        (class `moving` in design/oidb_binaries_criteria.md), so a static fit of a longer
        stretch is itself misspecified"
      window: closure phases, 2.05-2.18 um
      model:
        externals: "M1 with a point primary (diam fixed at 0)"
        literature: "M2 = two point sources"
      literature: >
        Xuan et al. 2024, Nature 634, 1070, Table 1 (orbit; per-epoch positions not
