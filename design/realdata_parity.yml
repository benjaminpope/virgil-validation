# --------------------------------------------------------------------------------------------
# Part B: real-data null test of virgil's detection pipeline
# --------------------------------------------------------------------------------------------
null_test:
  question: >
    On real calibrated data that hold no companion, how often does virgil's detection
    statistic exceed the thresholds that its own Monte Carlo (gaussian_null thresholds at a
    stated false-alarm probability) assigns, compared with the nominal probability, with
    and without rescale_errors?
  population:
    selection_rule: >
      Applied by a query written and committed BEFORE any file is fitted (the second
      registration: the list of observation ids with their sha256, as oidb/manifest.yml).
      Targets in the OiDB at calibration level 3 (released) or from the ESO Phase 3
      products, calibrated OIFITS with at least 3 telescopes (so a closure triangle exists)
      and at least 60 closure-phase samples; one night per target is the unit.
      Exclusions: SIMBAD object types of binary, multiple, spectroscopic or eclipsing
      binary, emission-line or Be star, Wolf-Rayet, YSO, post-AGB, Mira or other variable
      with an envelope; any target in WDS, ORB6 or SB9; Gaia DR3 RUWE > 1.4; any target
      whose publication reports a companion; any target whose own OI_TARGET or file name
      carries a binary or component suffix (A, B, Ab).
      L2 (unreleased) data stay out (DATA_ATTRIBUTION.md).
    strata:
      S_clean: calibrators and single stars, observed to calibrate or as diameter targets
      S_survey: science stars of a companion survey with a published non-detection
        (may hold a companion below the survey limit; an excess confined to this stratum
        is reported as "possible real companions", not charged to virgil)
      S_stress: stars with a disk or wind (Be, WR) from the OiDB surveys; reported only, to
        show the false-alarm rate when the null model is wrong
    minimum_size: {S_clean: 30, all_null: 60, instrument_families: 4}
    unit_independence: >
      Primary statistics use one night per target (the first by date). Every further night is
      secondary, tested with a cluster bootstrap over targets.
    candidates_found_in_the_repo:
      MIRC_X_H_band_collection_bda75673: >
        De Furio et al. 2022 (A-star survey), 28 files in 27 OI_TARGET names. Excluding the
        five published detections (HD 5448, HD 11636, HD 28910, HD 29388, HD 48097), omega Aur
        (a spectroscopic binary and Be-type; two instruments) and the SIMBAD-flagged, about 21
        files remain, of which HD 99787, HD 21912, HD 120047, HD 32301 and HD 74198 are the paper's
        calibrators (Table 2; S_clean) and the rest S_survey (HD 106661, HD 112734, HD 115271, HD 121164,
        HD 15550, HD 20677, HD 24809, HD 46089, HD 56537, HD 59037, HD 66664, HD 74873, HD 77660,
        HD 84107, HD 92941, HD 97244, and named stars among the 27 OI_TARGET names that the
        SIMBAD rule keeps). The paper's published detection limits at 1, 3, 5, 10, 50, 300 mas
        (Table 5) are an external check of the same files
      GRAVITY_calibrators_of_the_ESO_programmes: >
        gravity_calibrators.json of Track B (2.8 GB, not downloaded; design/trackb_criteria.md):
        the same-programme calibrators, closure phases only. SearchCal diameters make them
        unresolved stars; selected by the rule above
      PIONIER_calibrators: >
        pi1 Gru's calibrators HD 209688 and HD 215104 (reference record 19f7e2cf) and the
        OiDB's L1 collection that holds calibrators only (178 files, id in the private notes),
        if the dataPI terms allow
      SAM_calibrators: >
        AMICAL-reduced NACO calibrators of plan_eso_binaries.md Stage E4: HIP 74479, HIP 74865
        (HD 136164), HD 152249 (9 Sgr), delta Phe (delta Vel); Achernar is excluded (rapid
        rotator with a known companion). Calibrated by another calibrator: closure phases of
        a point source
      HD_45166_calibrator: >
        TYC 732-806-1 (a 3.3 mas binary, plan_oidb.md): not a null, the positive control
    positive_controls:
      rule: >
        The five published companions of the A-star collection (flux ratios 1.6 to a few
        percent, 6 to 65 mas) and TYC 732-806-1. Under the rescaled variant, at least 5 of
        these 6 must exceed the FAP 1e-3 threshold of delta_chi2. A null test that detects
        nothing passes vacuously; this guards against that. The detection fraction is reported
        per instrument. A positive control that is not detected is a finding about completeness
        (reported, ledger entry), not a pass of the null test
  procedure:
    per_file:
      load: scripts/oidb_fit.load, the observables and windows of the parity table above
      null_scene: UniformDisk with the diameter fitted (LogUniform(0.01, 20) mas) as the
        null; a point if the fitted diameter is below 0.05 mas
      grid: >
        dra and ddec in (-H, H), H = 30 mas (H = 10 mas for NACO SAM), step the larger of
        lambda_min/(2 B_max) and 2H/200 (at most about 4e4 cells), flux ratio geomspace(1e-4,
        0.3, 40). The coarser Monte Carlo grid is the registered price of N_null draws per file;
        a finer grid for the observed statistic only is not allowed (it would not match the
        thresholds)
      statistics: [delta_chi2 (primary), log_bayes_factor, max_snr]   # virgil.detection
      thresholds: >
        virgil.detection.injection_recovery with gaussian_null(null_scene, template) and
        n_null = 2000 draws per file, FAP levels 0.05, 0.01, 0.001 (DetectionMC.threshold,
        its bootstrap CI recorded); each file's observed statistic is converted to its
        false-alarm probability p_i (DetectionMC.false_alarm_probability) with the look-elsewhere
        effect of the grid built in
    variants:
      raw: template and data with the quoted errors
      rescaled: data and template from detection.rescale_errors(null_scene, data) (the vis and
        phi blocks each scaled to chi2/n = 1 for the null); the factors are recorded
      bootstrap: thresholds from detection.bootstrap_null (sign_flip) of the data about the null
        (reported; it removes a pure scale error and keeps heteroscedasticity)
      candid_nsigma: CANDID's fitMap nsigma on the same file, a second code's view (reported)
  criteria:
    primary: >
      the rescaled variant on S_clean; if S_clean has fewer than 30 targets, on S_null,
      labelled "contains possible real companions"
    N1_counts:
      statistic: k = number of files with p_i < alpha, alpha in {0.05, 0.01}, delta_chi2
      test: >
        one-sided exact binomial P(K >= k | N, alpha), fail if p < 0.01. One Holm family at
        0.01 over six p-values: these counts (2 levels x raw and rescaled = 4) and the two PIT tests (N2)
    N2_pit:
      statistic: the p_i of every file in the primary set
      test: one-sided Kolmogorov-Smirnov, alternative "p_i stochastically smaller than
        uniform" (too many small p), fail if p < 0.01 (same Holm family)
    N3_reported: >
      the exceedance fraction and its 95 percent Clopper-Pearson interval at each alpha, the
      ratio to nominal, the same for log_bayes_factor and max_snr, per instrument, per
      stratum, with and without the bootstrap thresholds, and the rate of FAP deficits
      (conservative), which is not a failure
    verdict:
      PASS: N1 and N2 hold for the rescaled variant on the primary set and the positive controls
        are detected
      FAIL: >
        N1 or N2 fails for the rescaled variant, which is a finding: ledger entry with the
        next free ID; a passing test pinned to the thresholds as documented; a strict xfail
        stating that the false-alarm probability on real noise exceeds the nominal
      RAW_VARIANT: reported with the same tests; its result decides one documentation
        statement, "use rescale_errors on real data" (needed or not), not the verdict
      INCONCLUSIVE: fewer than the minimum sizes; reported
  power_note: >
    With N = 60 independent nulls the count test at alpha = 0.05 fails for k >= 8 (expected 3.0;
    p = 0.0098) and at alpha = 0.01 for k >= 4 (expected 0.6; p = 0.0031). Its power against a
    false-alarm probability inflated by a factor of 2, 3, 5 is 0.25, 0.70, 0.99 at alpha = 0.05,
    and 0.03, 0.11, 0.35 at alpha = 0.01: the 0.01 count is nearly blind at this N and is
    reported mainly for its interval. The PIT test (N2) uses every file and carries the weight
    for a smaller or uniform inflation. The report states the inflation factor the data can
    exclude, as the detection campaign states its precision, and no finer calibration is claimed
  cost:
    downloads_mb: "S_survey and calibrators from the A-star collection are already in the Part A
      download (25.5 MB); the rest is to be set by the selection query (estimate 100-300 MB)"
    time_per_null_draw_s: "0.16 (17 x 17 cells, 120 V2 + 80 CP) to 0.32 (41 x 41), measured
      2026-10-12 on a laptop, eager, single process; a real MIRC-X file (15 baselines, 8
      channels) and 4e4 cells is 5 to 20 times heavier, so 1 to 5 s per eager draw; the
      compiled injection_recovery kernel is expected to be several times faster"
    cpu_hours: "60 files x 2000 draws x 2 variants x 1-5 s = 70-330 CPU-hours eager; with the
      compiled kernel, roughly 15-70. One OzSTAR array of 60 tasks (about 1-5 h each), or a GPU
      array"

# --------------------------------------------------------------------------------------------
# Part C: misspecification: later campaigns (scope only; no criteria are registered now)
# --------------------------------------------------------------------------------------------
misspecification_later:
  rule: >
    Each campaign gets its own registered file before it runs. Magnitudes are not guessed: Part A
    gives the fitted error scales and raw chi2/N of real files, and Part B the false-alarm excess,
    and a campaign injects the misspecification at the size that reproduces those numbers.
  campaigns:
    C1_nongaussian_closure_phases: >
      closure phases made from the argument of a bispectrum average at low S/N (wrapped,
      heavy-tailed, uniform below S/N about 1 per bispectrum), not Gaussian with sigma:
      simulator extension in src/crosscheck/simulate.py (complex noise on V12 V23 V13* then arg).
      Measure pull sd and coverage of the fit and the delta_chi2 tail, with and without
      the sine-plus-periodic-penalty residual
    C2_wavelength_correlated_errors: >
      errors correlated across spectral channels (squared-exponential or AR(1) in channel
      number, correlation length 0.5 to 8 channels), common to V2 and closure phase through the
      transfer function. Measure the error-bar ratio sigma_true/sigma_quoted against the
      effective number of independent channels, pull sd, and what the free phi_scale does to it
    C3_calibration_errors: >
      per-baseline, per-night multiplicative V2 errors (transfer-function drift, calibrator
      diameter error) and closure-phase offsets; marginalised or not with virgil's gains and
      phase_offsets (OIData.with_gains, with phase offsets). Measure bias of position and
      flux ratio and the coverage, the data's own chi2/N, and detection FAP
    C4_wrong_sigma: >
      true noise k times the quoted error, k in {0.5, 1, 2, 4}, uniform and then varying per
      baseline and per channel; gaussian_null(error_scale=k) exists for the detection part.
      Measure coverage with vis_scale and phi_scale free, with rescale_errors and with neither,
      and the false-alarm probability of the delta_chi2 statistic
    C5_unmodelled_structure: >
      a faint unmodelled companion or a disk in the null (the realistic null of a survey);
      measure the fit's bias and the false-alarm rate. Listed because Part B's S_survey and
      S_stress strata cannot separate it from the above
  cost: "a campaign each, one to two sessions of simulator and test work plus OzSTAR
    CPU time of the order of the detection campaign (10^4 to 10^5 draws)"
