#
# Analysis addendum for the numpyro_model SBC (scripts/sbc_numpyro.py).
# Registered on 2026-10-06, before any result of tasks 50-99 (OzSTAR job
# 18094456, virgil 4afc5b8) was seen; tasks 0-49 (job 18077226, 500
# replicates) had been seen. Rationale: design/sbc_addendum.md.
# The aggregator records this file's last commit in the summary (a dirty file is refused), and
# tests/test_sbc_numpyro.py checks it against the current commit.

campaign:               # moved here, values unchanged, from the CRITERIA dict of scripts/sbc_numpyro.py
  draws_per_replicate: 99      # L: ranks take values 0..99
  rank_bins: 20
  family_alpha: 0.01           # rank uniformity per parameter: chi-squared over the bins, Bonferroni over the parameters at a family-wise 1%
  coverage_levels: [0.68, 0.95]
  coverage_band: 0.99          # central 68% and 95% posterior intervals cover the truth within the 99% binomial band
  min_bulk_ess: 400            # sampler health: reported; replicates failing it are counted, not dropped
  max_rhat: 1.01
  min_replicates: 400

family_alpha: 0.01        # Holm, over every test listed under "primary"
primary:                  # all 1000 replicates, per parameter
  - chi2_bins             # chi-squared of the 20-bin rank histogram (as before)
  - coverage_68           # exact two-sided binomial test of 68% coverage
  - coverage_95           # exact two-sided binomial test of 95% coverage
  - mean_rank             # z-test of the mean normalized rank (detects bias)
  - ecdf                  # sup |ECDF - uniform| of the ranks, p-value by 10^4 simulations (Sailynoja et al. 2022)
ecdf_simulations: 10000
ecdf_seed: 20261006
confirmatory:             # tasks 50-99 only (replicates not seen when registered)
  diam_small:
    tasks: [50, 99]
    truth: {parameter: diam, below: 0.9}   # mas
    tests: [chi2_bins, coverage_95]
    alpha: 0.01                            # Holm within these two; a rejection fails the campaign
descriptive:              # reported, never pass/fail
  - exclude_unhealthy     # the same tests without replicates with divergences, R-hat > 1.01 or bulk ESS < 400
  - divergences_vs_truth  # Spearman correlation of divergences with each true parameter
