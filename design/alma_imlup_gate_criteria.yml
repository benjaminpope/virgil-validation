#
# Thresholds of the IM Lup gates in src/virgil_bridge/alma_start.py: the cold-start gate
# (cold_start_gate) and the Track A "better than MPoL" pass (better_than_mpol).
# Extracted verbatim from that module's constants on origin/main 473d8cc (rules: design/alma_imlup_p3.md).
# The gate commands record this file's last commit and refuse a file with uncommitted changes. The check lists (a)-(e) and 1-5 stay in the docstrings of cold_start_gate and
# better_than_mpol; only their numbers live here.
cold_start:
  flux_tol: 0.10           # GATE_FLUX_TOL
  dead_tol: 0.01           # GATE_DEAD_TOL
  reference_flag: 0.05     # GATE_REFERENCE_FLAG
better_than_mpol:
  mpol_raw_chi2n: 2.7062   # MPOL_RAW_CHI2N
  neff_min: 0.7            # BETTER_NEFF
  dead_max: 0.01           # BETTER_DEAD
  flux_tol: 0.1
  nrmse_beam_fraction: '0.5'
  heldout: 'mean(d) + se(d) < 0 for the per-fold raw chi^2/N differences d (ours - MPoL''s, same folds), se = sd / sqrt(K): below MPoL''s by more than the fold-to-fold scatter'
  rationale: thresholds as approved by Ben 2026-10-28 (design/alma_imlup_p3.md, Track A); none was chosen after a result
# Track A multi-truth synthetic test, recomputed C8 and the replica pass (virgil-validation#205). Every value is the one first committed on that PR, before any run that uses it;
# none was tuned to a result. Never edit after a run to fit it: a changed value is a new commit and needs a new run.
c8:
  tol: 0.1
  window: 100
  tol_derivation: 'the loss is -ln L (plus priors), so a change of 1/2 is chi^2 changing by 1, one effective degree of freedom at one sigma: a loss that changes by less than that cannot
    change any inference. 0.1 is a fifth of it, i.e. chi^2 by 0.2, and a still-falling loss at 0.1 per 100 steps leaves a total displacement of order sqrt(2 x 0.1) = 0.45 sigma in the
    Hessian norm. It is an absolute -ln L tolerance and was fixed before r1b, not after any result.'
  lbfgs: 'L-BFGS stages, including the GP, keep the two-point test (|loss(last) - loss(>= window steps earlier)| < tol): L-BFGS with a line search never raises the loss, so the window
    test''s range condition (max - min over the last window) equals the two-point change for it, and the oscillation the window test exists to catch (Adam) cannot occur. The window test''s
    drift condition has no L-BFGS counterpart: it would admit a loss still falling by less than tol per window, which is the tolerance by definition. Records are every 200 steps, so
    the reference is the latest one at least window steps earlier.'
  recompute: 'better recomputes C8 from the saved per-stage history (Adam: adam.loss_history, convergence_window; L-BFGS: trajectory, convergence) and refuses a stage whose stored c8_converged
    disagrees'
