lambda_selection:
  # Revised 2026-11-05, before any real-data run, after the synthetic diagnosis (testC/P/M/S/E in ~/data/alma_imlup/diagnosis/) found the
  # first draft flawed: s_k^2 from the unregularised fit makes the discrepancy target the chi^2 floor, so it selects w -> 0.
  rule: discrepancy_dof_corrected
  primary_arm: mem_sqrt_pixels
  dropped_arms: [starlet_l1]
  exploratory_arms: [gaussian_field_order4, multipole_field]
  crop: {npix: 384, pixel_mas: 7.5}
  text: |
    **Primary arm: maximum entropy on √I pixels.**
    1. **Noise scale.** Rescale visibility weights by s², estimated from the data scatter on the full data (successive differences
       per baseline, spw and scan, as CASA `statwt`), never from an image fit. Record s² and its uncertainty; the relative
       uncertainty must be ≤ 2e-3. Report raw χ²/N with the quoted weights first.
    2. **Pixels and solver.** Maximum entropy on √I pixels (x = √I, L-BFGS), started flat or from a blurred CLEAN image.
    3. **Fast loop.** On the Σw-preserving subsample, fit w on a log grid with steps of ×√10, warm-started from large w. At each w
       compute χ²_q and G = Tr[K(K + wI)⁻¹] (Hutchinson, 16 Rademacher probes, CG relative tolerance 1e-4; report the standard
       error).
    4. **Choice of w.** w is the root in ln w of m(w) = χ²_q/s² − (n_real − G): interpolate, take one secant step, and accept when
       |m| ≤ 3·se(G). Also report w at s² ± 2σ_s. Report classic MaxEnt's h(w) = 2(w/s²)KL − G as a diagnostic only.
    5. **Full data.** Fit at the same w, and check G on the full data once against the fast loop.
    6. **Convergence (replaces C8).** kkt_w (rms of g − μ over pixels with b > 1e-3·b_max, in units of w/F) < 1e-4, and the band
       limit f_eta/f_floor < 2.
    7. **Nuisances (gains, offsets, σ factors), staged.** (1) Image with the nuisances at nominal; (2) nuisances with the image
       fixed; (3) joint refinement with its own KKT check. Fix one reference gain at 1. The fit fails if any nuisance ends within
       5% of its prior box edge. When σ factors are fitted, apply w in w/s² units on the fast loop at the matching noise scale.
    8. **Report.** Raw χ²/N, s², G, w, w/s², rms ψ_hp on the disc and in two brightness bins, f_eta/f_floor, nuisance values with
       their box edges.
    9. **Known bias, stated in advance.** On synthetic spiral discs this arm under-recovers spiral and ring contrast by about 20%
       at the chosen w (testS: m = 2 amplitude ratio 0.77/0.79). Contrast claims carry this caveat.

    **Dropped arms.** StarletL1 (dots, ψ_hp 0.47/0.59, lowest contrast in testS).

    **Field arms (GaussianField order 4, MultipoleField).** Not pre-registered; exploratory only. Any field-arm image is reported
    as exploratory, with its hyperparameters and how they were chosen, and carries no gate weight. (testE, pre-stated in
    evidence_rule_spec.md: the Laplace-evidence choice was not within 1.15× of the arm's own best NRMSE on 4/4 cases for
    GaussianField order 4 and 3/4 for MultipoleField.)

    **Added 2026-11-06, before any real-data run** (approved by Ben after synthetic rehearsal R, ~/data/alma_imlup/diagnosis/rehearsal/).
    These settle cases items 1, 4 and 7 left open; no number above changes.
    D1. **Grid and no root.** The fast-loop grid is w/s² from 1e8 down to 1e2 in steps of ×√10, fixed now and never extended
        after a run. m must be > 0 at the first point; the run fails if it is not, or if m has no sign change on the grid.
        It never falls back to the grid's weak end (rehearsal R1: an s² 5% too small has no root, and the weak end brings back
        chains of dots).
    D2. **Iterate the secant step** (item 4) until |m| ≤ 3·se(G), at most 5 steps. If |m| > 3·se(G) after 5 steps, the run fails.
    D3. **Reference gain** (item 7): the observation with the largest Σw, chosen from the weights alone before any fit.
    D4. **Bias of the noise scale** (item 1), checked before real data: add 20 realisations of noise with a known s² to the pinned
        CLEAN model's visibilities at the real measurement set's time, baseline, spw and scan sampling, and run the same scatter
        estimator. Pass: |mean − s²| ≤ 2·sd/√20 and ≤ 2e-3·s². On the real data, also report the lag-1 correlation of successive
        differences (−0.5 for white noise). If D4 fails, no real-data run is made.
    D5. **Several crossings:** if m(w) changes sign more than once, take the crossing at the largest w (the strong-regularisation end)
        and report every crossing.

    **Added 2026-11-08, before any real-data run** (approved by Ben after review of the driver, vv#219).
    D6. **The fast loop runs on the full data** (stride 1), with the Toeplitz χ². Items 3 and 5 name a Σw-preserving subsample;
        that is withdrawn. Thinning real data to 1/k with weights scaled by k leaves noise of variance ≈ k·s² per kept datum in
        the scaled units, so each fitted degree of freedom removes ≈ k·s² of χ², not s²: m(w) = χ²_q/s² − (n_real − G) is then
        biased towards large w by ≈ (k − 1)·G. (The synthetic tests drew their noise on the subsample itself, where the formula
        is exact.) On the full data the formula of item 4 holds as written, and item 5's G check compares the fast loop's G
        with itself, so it is dropped. The Toeplitz χ² makes the full-data cost per fit almost independent of the number of
        visibilities.
  changed_after_seeing_a_result: 'yes: this block replaces the draft appended earlier in this PR (a discrepancy rule with s_k fixed from an
    unregularised fit, MEM and StarletL1 swept on a log grid to C8). The rule was revised after the synthetic tests testC, testP, testM,
    testS and testE (~/data/alma_imlup/diagnosis/), which showed that the draft selects the chi^2 floor, that StarletL1 gives dots, and
    that the Laplace-evidence choice for the field arms fails. No real-data result exists for either version; this revision precedes
    every real-data run of the rule. 2026-11-06: D1–D5 were added after synthetic rehearsal R (no real data). D2 replaces item 4''s single secant step with up to     5; D1 pins the grid range; D2 and D4 add thresholds (5 steps; 20 realisations, 2·sd/√20). No existing value changes.
    2026-11-08: D6 moves the fast loop to the full data (stride 1), after an analytic finding in review (no real data, no run):
    the subsample''s discrepancy target is biased by ≈ (k − 1)·G. No threshold changes.'
