name: validation
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * 1"  # weekly, against virgil's main branch
  workflow_dispatch:

env:
  # The virgil commit that pull requests and pushes test against. Bump it
  # deliberately; the weekly and manual runs test virgil's main instead.
  VIRGIL_REF: d79696de9d970396d9f2d007312bcffc3bcf11e7  # virgil#664 merged: sqrt-pixel LinearImage, L-BFGS-B, kkt_report, LCurve.dof_discrepancy, fit_staged_nuisances (the registered IM Lup lambda rule)

  # The virgil-vlti commit (public; the loader behind tests/test_calibrated_load.py,
  # which skips without it). Bump deliberately; weekly and manual runs use main.
  VLTI_REF: 29dfaa77dd80338b9cf25d9c354e4055c6f93c4a  # virgil-vlti main at 2026-10-22: release-packaging merge (#1)

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - name: environment
        run: |
          uv venv --python 3.12 .venv
          ref="$VIRGIL_REF"
          vlti_ref="$VLTI_REF"
          if [ "${{ github.event_name }}" = schedule ] || [ "${{ github.event_name }}" = workflow_dispatch ]; then ref=main; vlti_ref=main; fi
          echo "Testing virgil at $ref, virgil-vlti at $vlti_ref"
          uv pip install --python .venv/bin/python -e ".[external,polar-disk]" \
            "virgil-astro[orbits,radio] @ git+https://github.com/benjaminpope/virgil@$ref" \
            "virgil-vlti @ git+https://github.com/benjaminpope/virgil-vlti@$vlti_ref"
      - name: imaging-contest data cache
        uses: actions/cache@v4
        with:
          path: ~/data/imaging_contests
          key: contests-${{ hashFiles('contests/manifest.yml') }}
      - name: imaging-contest data (test binaries)
        run: .venv/bin/python scripts/fetch_contests.py --year 2004 2006 2008 2010
      - name: CANDID (own environment, pinned commit)
        run: bash scripts/setup_candid.sh
      - name: eht-imaging, MPoL, fouriever, orbitize! and CASA (own environments, pinned versions)
        run: bash scripts/setup_external.sh ehtim mpol fouriever orbitize alma
      - name: orbit page (generated, git-ignored; the docs-link tests and the Trust page read it)
        run: |
          .venv/bin/python scripts/orbit_gallery.py render --out build/orbit_gallery.md --json docs/assets/orbits.json
          .venv/bin/python scripts/build_orbits_page.py
      - name: fast tests
        if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
        env:
          VV_REQUIRE_VLTI: "1"  # tests/test_calibrated_load.py must not skip silently
          VV_REQUIRE_VIRGIL_IMPORTS: "1"  # a missing virgil module is a collection error, not a silent skip
        run: .venv/bin/python -m pytest -m "not slow" -v --evidence evidence.jsonl
      - name: all tests
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          VV_REQUIRE_VLTI: "1"
          VV_REQUIRE_VIRGIL_IMPORTS: "1"
        run: .venv/bin/python -m pytest -v --evidence evidence.jsonl
      - name: virgil's own evidence
        # weekly and manual runs: the JUnit evidence from virgil's latest
        # successful CI run on main (the float64 Linux job)
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          read -r run sha <<< "$(gh run list -R benjaminpope/virgil -w tests.yml -b main -s success -L 1 --json databaseId,headSha --jq '.[0] | "\(.databaseId) \(.headSha)"')"
          gh run download "$run" -R benjaminpope/virgil -n virgil-evidence-ubuntu-latest-py3.12-x641 -D virgil-ci
          .venv/bin/python scripts/ingest_virgil_evidence.py virgil-ci/junit-evidence.xml virgil-evidence.jsonl \
            --commit "$sha" --run-url "https://github.com/benjaminpope/virgil/actions/runs/$run"
      - name: virgil history (for staleness)
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        uses: actions/checkout@v4
        with:
          repository: benjaminpope/virgil
          path: virgil-src
          fetch-depth: 0
      - name: trust page
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        run: |
          extra=$( [ -f virgil-evidence.jsonl ] && echo "--evidence virgil-evidence.jsonl" )
          .venv/bin/python scripts/trust.py --evidence evidence.jsonl $extra \
            --virgil virgil-src --out trust.md --json trust.json
          cat trust.md >> "$GITHUB_STEP_SUMMARY"
      - name: verdict diff against main (informational, never fails the job)
        # The Trust page's verdicts on this PR's evidence against those on the
        # newest push run on main, and the validates-marker changes in the
        # diff. Each side is built by its own tree's scripts/trust.py.
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "## Verdict diff against ${{ github.base_ref }}"
            # the checkout is shallow, so fetch the base ref before using it
            if ! git fetch --depth=1 origin "${{ github.base_ref }}":refs/remotes/origin/"${{ github.base_ref }}" \
               || ! git worktree add ../base "origin/${{ github.base_ref }}" > /dev/null; then
              echo "**Base tree for \`${{ github.base_ref }}\` could not be built (git error above): no marker or verdict diff was made.**"
              exit 0
            fi
            echo
            echo "### Markers (tests added, removed or re-marked)"
            .venv/bin/python scripts/marker_inventory.py ../base . || echo "marker diff failed"
            echo
            echo "### Verdicts (PR's fast-test evidence against main's newest push run)"
            if [ ! -f evidence.jsonl ]; then echo "no evidence from this run"; exit 0; fi
            mkdir -p ../base-ci
            if ! scripts/fetch_ci_evidence.sh --push-only ../base-ci > /dev/null || [ ! -f ../base-ci/push/evidence.jsonl ]; then
              echo "main's push evidence could not be fetched"; exit 0
            fi
            .venv/bin/python scripts/trust.py --evidence evidence.jsonl \
              --out ../after.md --json ../after.json > /dev/null || { echo "trust.py failed on the PR's evidence"; exit 0; }
            (cd ../base && "$GITHUB_WORKSPACE/.venv/bin/python" scripts/trust.py --evidence ../base-ci/push/evidence.jsonl \
              --out ../before.md --json ../before.json > /dev/null) \
              || { echo "trust.py failed on main's evidence"; exit 0; }
            .venv/bin/python scripts/trust_diff.py ../before.json ../after.json || echo "trust_diff failed"
          } >> "$GITHUB_STEP_SUMMARY" 2>&1
      - name: evidence table
        if: always()
        run: |
          if [ -f evidence.jsonl ]; then
            .venv/bin/python scripts/evidence_table.py evidence.jsonl evidence.md \
              $( [ -f virgil-evidence.jsonl ] && echo virgil-evidence.jsonl )
            cat evidence.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-${{ github.event_name }}-${{ github.run_id }}
          path: |
            evidence.jsonl
            virgil-evidence.jsonl
            evidence.md
            trust.md
            trust.json
          if-no-files-found: ignore

  report:
    # The full report (scripts/report.py: 200-draw pulls, dLux images) is
    # too heavy for every PR; weekly and manual runs regenerate it and
    # upload docs/results.md and the figures, to be committed by hand.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - name: environment
        run: |
          uv venv --python 3.12 .venv
          uv pip install --python .venv/bin/python -e ".[external]" \
            "virgil-astro[orbits,radio] @ git+https://github.com/benjaminpope/virgil@main"
      - name: report
        run: .venv/bin/python scripts/report.py --pulls 200
      - uses: actions/upload-artifact@v4
        with:
          name: report-${{ github.run_id }}
          path: |
            docs/results.md
            docs/*.png
