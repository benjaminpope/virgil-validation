name: docs
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        # virgil's history, so the Trust page can say what changed since
        # the evidence was measured
        with:
          repository: benjaminpope/virgil
          path: virgil-src
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - name: build
        run: |
          uv venv --python 3.12 .venv
          uv pip install --python .venv/bin/python "mkdocs<2" mkdocs-material "zensical>=0.0.62,<0.1" pyyaml
          # the Trust page from the committed evidence, graph and ledger
          # campaigns.jsonl: OzSTAR campaigns' summaries, each read under the virgil
          # commit the campaign ran on (freshness against the pin is a note)
          .venv/bin/python scripts/trust.py --evidence trust/evidence/latest.jsonl \
            --evidence trust/evidence/virgil.jsonl --evidence trust/evidence/campaigns.jsonl --virgil virgil-src \
            --out docs/trust.md --index docs/index.md --json docs/assets/trust.json \
            --findings docs/method/findings.md
          # Zensical, as virgil (it reads mkdocs.yml); strict fails on warnings
          .venv/bin/zensical build --clean --strict
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    # Only this job, which runs no repository code, can publish.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
