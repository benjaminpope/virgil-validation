name: docs
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_run:  # rebuild when a validation run on main finishes, with its evidence
    workflows: [validation]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read  # to download the validation runs' evidence

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # to check that each run's commit is in this branch's history
      - uses: actions/checkout@v4
        # virgil's history, so the Trust page can say what changed since
        # the evidence was measured
        with:
          repository: benjaminpope/virgil
          path: virgil-src
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - name: build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          uv venv --python 3.12 .venv
          uv pip install --python .venv/bin/python "mkdocs<2" mkdocs-material "zensical>=0.0.62,<0.1" pyyaml
          # the Trust page from CI's evidence only (scripts/fetch_ci_evidence.sh):
          # the newest run on main and the newest weekly or manual run, each test
          # keeping its newest outcome. campaigns.jsonl: OzSTAR campaigns' summaries,
          # each read under the virgil commit the campaign ran on.
          scripts/fetch_ci_evidence.sh ci
          extra=$(for f in ci/full/evidence.jsonl ci/full/virgil-evidence.jsonl; do [ -f "$f" ] && echo "--evidence $f"; done)
          .venv/bin/python scripts/trust.py --strict-provenance --evidence ci/push/evidence.jsonl $extra \
            --evidence trust/evidence/campaigns.jsonl --virgil virgil-src \
            --out docs/index.md --json docs/assets/trust.json \
            --findings docs/method/findings.md --coverage docs/method/coverage.md
          # Zensical, as virgil (it reads mkdocs.yml); strict fails on warnings
          .venv/bin/zensical build --clean --strict
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    # Only this job, which runs no repository code, can publish.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
