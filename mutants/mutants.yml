  replacement: |-
    mas2rad = np.pi / 180.0 / 3600.0 / 100.0  # convert mas to rad
  nodes: [virgil.models.UniformDisk, virgil.models.GaussianDisk, virgil.models.cvis_binary]

- id: M07
