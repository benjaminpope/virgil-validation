# Mutation-testing campaign for virgil-validation (scripts/mutation.py).
#
# Each mutant is a plausible slip in virgil, as a precise textual patch against
# the pinned virgil commit: `original` must occur exactly `count` times
# (default 1) in `file`, and is replaced by `replacement`. A mutant with
# several edits lists them under `edits:` (each with file, original,
# replacement, count). `nodes` are the trust/graph.yml nodes the slip
# belongs to: the harness runs the tests that validate them first (so a
# kill is found early) but then the whole of tier A, so a mutant counts as
# killed by ANY test. `cls` is the class of slip. Mutants written from
# virgil's source on purpose: this file is a probe of the tests, not an
# independent reference, and nothing here leaks into src/crosscheck.
#
# tests/test_mutants_apply.py checks that every mutant still applies
# cleanly to `pin`, so a virgil bump that moves a snippet fails loudly.

pin: 0c1be69c61afc524c21ac327e41329d0ee15ac5d   # virgil main after PR #323

mutants:
# ---------------------------------------------------------------- FT conventions
- id: M01
  cls: ft_conj_sign
  description: "Fourier shift factor conjugated (exp(+i...) instead of exp(-i...)), the sign of the transform."
  file: src/virgil/_geometry.py
  original: |-
    return jax.lax.complex(np.cos(arg), -np.sin(arg))
  replacement: |-
    return jax.lax.complex(np.cos(arg), np.sin(arg))
  nodes: [virgil.models.PointSource, virgil.models.cvis_binary, virgil.models.BinaryModelCartesian, virgil.models.System]

- id: M02
  cls: ft_conj_sign
  description: "Pixel-image DFT kernel exp(+2 pi i f x) instead of exp(-2 pi i f x)."
  file: src/virgil/_geometry.py
  original: |-
    return np.exp(-2j * np.pi * np.outer(mas2rad * freq_per_rad, offsets))
  replacement: |-
    return np.exp(2j * np.pi * np.outer(mas2rad * freq_per_rad, offsets))
  nodes: [virgil.models.Image, virgil.models.Image.model_on_grid]

- id: M03
  cls: uv_swap
  description: "Offset phase pairs u with ddec and v with dra (u<->v swapped)."
  file: src/virgil/_geometry.py
  original: |-
    arg = 2.0 * np.pi * mas2rad * (uu * dra + vv * ddec)
  replacement: |-
    arg = 2.0 * np.pi * mas2rad * (uu * ddec + vv * dra)
  nodes: [virgil.models.PointSource, virgil.models.cvis_binary, virgil.models.BinaryModelCartesian]

- id: M04
  cls: pi_factor
  description: "Offset phase uses pi instead of 2 pi."
  file: src/virgil/_geometry.py
  original: |-
    arg = 2.0 * np.pi * mas2rad * (uu * dra + vv * ddec)
  replacement: |-
    arg = np.pi * mas2rad * (uu * dra + vv * ddec)
  nodes: [virgil.models.PointSource, virgil.models.cvis_binary]

- id: M05
  cls: dra_sign
  description: "Component offset applied with the RA sign flipped (East negative)."
  file: src/virgil/models.py
  original: |-
    return self._centred_cvis(uu, vv) * offset_phase(
                uu, vv, self.dra, self.ddec
            )
  replacement: |-
    return self._centred_cvis(uu, vv) * offset_phase(
                uu, vv, -self.dra, self.ddec
            )
  nodes: [virgil.models.PointSource, virgil.models.GaussianDisk, virgil.models.UniformDisk, virgil.models.System]

# ---------------------------------------------------------------- unit factors
